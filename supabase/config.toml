# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "workspace"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.network_restrictions]
enabled = false
allowed_cidrs = ["0.0.0.0/0"]
allowed_cidrs_v6 = ["::/0"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

# Funções chamadas diretamente pelo APK/site. A proteção delas é feita pelo próprio código
# usando deviceCode, deviceUuid ou credenciais específicas do aparelho.
[functions.device-config]
verify_jwt = false

[functions.device-config-direct]
verify_jwt = false

[functions.device-config-qualified]
verify_jwt = false

[functions.device-activate]
verify_jwt = false

[functions.device-unlink]
verify_jwt = false

[functions.series-detail]
verify_jwt = false

[functions.channel-epg]
verify_jwt = false

[functions.playlist-cache]
verify_jwt = false

# Invocada apenas pelo pg_cron. A autenticação é feita por token aleatório
# armazenado no Vault e validado dentro da própria função.
[functions.playlist-cache-auto]
verify_jwt = false

[functions.app-release]
verify_jwt = false

[functions.playback-diagnostics-report]
verify_jwt = false

[functions.playlist-provider-attempt-report]
verify_jwt = false

[functions.device-library]
verify_jwt = false

# Web Player usa autenticação própria ligada ao aparelho ativo. O gateway valida
# web_session/token escopado dentro do handler; não usa JWT Supabase do usuário.
[functions.web-player-auth]
verify_jwt = false

[functions.web-player-access]
verify_jwt = false

[functions.web-player-catalog]
verify_jwt = false

[functions.web-player-playback]
verify_jwt = false

[functions.web-player-media]
verify_jwt = false

[functions.web-player-library]
verify_jwt = false

[functions.web-player-diagnostics]
verify_jwt = false

# Funções de painel usam Supabase Auth e papéis individuais.
[functions.admin-panel]
verify_jwt = true

[functions.admin-inline-playlist]
verify_jwt = true

[functions.admin-credit-adjust]
verify_jwt = true

[functions.seller-provision]
verify_jwt = true

[functions.seller-delete]
verify_jwt = true

[functions.seller-auth-cleanup]
verify_jwt = true

[functions.seller-panel]
verify_jwt = true

[functions.seller-playlist-refresh]
verify_jwt = true

[functions.support-panel]
verify_jwt = true

[functions.seller-commercial-panel]
verify_jwt = true

[functions.finance-panel]
verify_jwt = true

[functions.credit-packages-panel]
verify_jwt = true

[functions.subscription-panel]
verify_jwt = true

[functions.subscription-playlist-edit]
verify_jwt = true

[functions.playlist-registration]
verify_jwt = true

[functions.playlist-validation]
verify_jwt = true

[functions.playlist-fingerprint-backfill]
verify_jwt = true

[functions.admin-operations-panel]
verify_jwt = true

[functions.lg-review-panel]
verify_jwt = true

[functions.playlist-source-manager]
verify_jwt = true

[functions.web-access-panel]
verify_jwt = true

[functions.web-access-panel-core]
verify_jwt = true
