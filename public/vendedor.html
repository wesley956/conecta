<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" />
  <title>Portal do Vendedor — RonecaPlayTV</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #080b14;
      color: #f8fafc;
    }
    main {
      width: min(560px, 100%);
      padding: 32px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 20px;
      background: #101624;
      box-shadow: 0 24px 70px rgba(0,0,0,.35);
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: clamp(24px, 5vw, 36px); }
    p { margin: 0 0 24px; color: #cbd5e1; line-height: 1.6; }
    a {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 0 22px;
      border-radius: 12px;
      background: #2563eb;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Portal do Vendedor</h1>
    <p>O acesso por token foi desativado. Você será direcionado ao portal oficial com login individual por email e senha.</p>
    <a id="sellerPortalLink" href="https://wesley956.github.io/conecta/seller.html" rel="noreferrer">Abrir portal seguro</a>
  </main>
  <script>
    window.setTimeout(function redirectToSecureSellerPortal() {
      window.location.replace(document.getElementById('sellerPortalLink').href);
    }, 900);
  </script>
</body>
</html>
