<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src https://awauvkjkucjqulkklmuo.supabase.co; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'"><title>RonecaPlayTV Web — Homologação</title><link rel="icon" href="./brand/ronecaplaytv-symbol.svg"><link rel="stylesheet" href="./manage.css"></head><body><main><section class="brand"><img src="./brand/ronecaplaytv-symbol.svg" alt=""><h1>RonecaPlayTV Web</h1><p>Configuração de homologação</p></section><section class="card" id="loginCard"><span>ETAPA 1</span><h2>Entrar no painel</h2><p>Use sua conta ADM ou Vendedor.</p><form id="loginForm"><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form><div class="msg" id="loginMsg"></div></section><section class="card hidden" id="pinCard"><span>ETAPA 2</span><h2>Ativar acesso Web</h2><p>Informe o código do aparelho ativo e escolha um PIN Web de 6 dígitos.</p><form id="pinForm"><label>Código do aparelho<input id="deviceCode" autocomplete="off" required></label><label>PIN Web<input id="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" required></label><button>Salvar PIN e ativar Web</button></form><div class="msg" id="pinMsg"></div><a class="player hidden" id="playerLink" href="./index.html">Abrir Web Player →</a><button class="secondary" id="logout" type="button">Trocar conta</button></section></main><script src="./manage.js" defer></script></body></html>
