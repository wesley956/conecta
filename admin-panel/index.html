<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>RonecaPlayTV · Acesso aos painéis</title>
  <link rel="stylesheet" href="./pro-panel.css" />
  <link rel="stylesheet" href="./access.css" />
  <script src="./access.js" defer></script>
</head>
<body>
  <main class="access-screen">
    <section class="access-card" aria-labelledby="accessTitle">
      <img class="access-logo" src="./assets/cruz-stars-logo.png" alt="RonecaPlayTV" />
      <p class="access-kicker">RonecaPlayTV</p>
      <h1 id="accessTitle">Acesso aos painéis</h1>
      <p class="access-description">Entrada única para administrador e vendedores autorizados.</p>

      <form id="accessForm" novalidate>
        <label for="accessToken">Token de acesso</label>
        <input id="accessToken" type="password" autocomplete="current-password" placeholder="Digite seu token" />
        <div class="access-actions">
          <button id="loginButton" class="access-button is-primary" type="submit">Entrar</button>
          <button id="clearLoginButton" class="access-button" type="button">Limpar acesso salvo</button>
        </div>
      </form>

      <p id="accessMsg" class="access-message" role="status" aria-live="polite">Digite seu token para continuar.</p>
    </section>
  </main>
</body>
</html>
