<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Roneca Player TV — Acesso ao painel</title>
  <style>
    :root {
      --bg: #030816;
      --card: rgba(5, 14, 38, .74);
      --line: rgba(110, 231, 255, .34);
      --text: #eef7ff;
      --muted: #a9bbdd;
      --cyan: #6ee7ff;
      --violet: #7b5cff;
      --red: #ff6575;
      --green: #28e39a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Segoe UI, Arial, sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(1, 6, 20, .08), rgba(1, 6, 20, .70)),
        radial-gradient(circle at 50% 18%, rgba(78, 160, 255, .16), transparent 30%),
        radial-gradient(circle at 50% 82%, rgba(123, 92, 255, .14), transparent 34%),
        url("./assets/universe-bg.png") center center / cover no-repeat;
    }

    .screen {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(590px, 100%);
      border-radius: 28px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(8,22,55,.72), rgba(3,9,28,.88));
      box-shadow:
        0 0 0 1px rgba(112, 210, 255, .08) inset,
        0 0 44px rgba(47, 164, 255, .22),
        0 30px 90px rgba(0, 0, 0, .46);
      backdrop-filter: blur(18px);
      padding: 34px;
      text-align: center;
    }

    .logo {
      width: 92px;
      height: 92px;
      margin: 0 auto 18px;
      border-radius: 26px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(110,231,255,.28);
      box-shadow: 0 0 32px rgba(110,231,255,.28);
      overflow: visible;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 8vw, 58px);
      line-height: .95;
      background: linear-gradient(90deg, #f4f8ff, #7b86ff, #72ecff);
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
    }

    p {
      color: var(--muted);
      margin: 12px 0 0;
      line-height: 1.55;
    }

    label {
      display: block;
      text-align: left;
      margin: 26px 0 8px;
      color: #dbeaff;
      font-weight: 800;
    }

    input {
      width: 100%;
      border: 1px solid rgba(110,231,255,.32);
      background: rgba(0,0,0,.25);
      color: var(--text);
      padding: 16px 15px;
      border-radius: 16px;
      outline: none;
      font: inherit;
      text-align: center;
      letter-spacing: .04em;
    }

    .actions {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      border: 0;
      color: white;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      padding: 14px;
      border-radius: 16px;
      cursor: pointer;
      font-weight: 900;
      font-size: 16px;
    }

    .ghost { background: rgba(255,255,255,.09); }
    .msg { min-height: 24px; margin-top: 14px; color: var(--muted); }
    .err { color: #fecdd3; }
    .ok { color: #bbf7d0; }
  </style>
  <link rel="stylesheet" href="./pro-panel.css" />
  <link rel="stylesheet" href="./panel-redesign.css" />
  <link rel="stylesheet" href="./roneca-panel-premium.css" />
</head>
<body class="admin-v2 admin-login-v2">
  <main class="screen">
    <section class="card">
      <div class="login-brand-lockup">
        <div class="logo"><img src="./assets/roneca-player-tv-emblem.png" alt=""></div>
        <img class="login-wordmark" src="./assets/roneca-player-tv-wordmark.svg" alt="Roneca Player TV">
      </div>
      <span class="login-eyebrow">Gestão, controle e resultados</span>
      <h1>Acesso ao painel</h1>
      <p>Entre para administrar clientes, aparelhos, listas e vendas.</p>

      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" placeholder="seu@email.com" />

      <label for="password">Senha</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" />

      <div class="actions">
        <button class="primary login-primary" type="button" onclick="login()">Entrar</button>
        <button class="ghost" type="button" onclick="clearLogin()">Limpar acesso salvo</button>
      </div>

      <div id="msg" class="msg">Informe seu e-mail e senha para continuar.</div>
    </section>
  </main>

  <script src="./panel-config.js"></script>
  <script src="./panel-auth-session.js"></script>
  <script src="./roneca-panel-premium.js"></script>
  <script>
    var ADMIN_API = 'https://awauvkjkucjqulkklmuo.supabase.co/functions/v1/admin-panel';
    var SELLER_API = 'https://awauvkjkucjqulkklmuo.supabase.co/functions/v1/seller-panel';

    function el(id) { return document.getElementById(id); }
    function setMsg(text, cls) {
      el('msg').textContent = text;
      el('msg').className = 'msg ' + (cls || '');
    }

    async function callRoleApi(api, action) {
      var res = await fetch(api, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: action })
      });
      if (!res.ok) return false;
      await res.json().catch(function () { return {}; });
      return true;
    }

    async function routeAuthenticatedSession() {
      if (await callRoleApi(ADMIN_API, 'listCommercialData')) {
        window.location.href = './dashboard.html';
        return true;
      }
      if (await callRoleApi(SELLER_API, 'dashboard')) {
        window.location.href = './seller.html';
        return true;
      }
      return false;
    }

    async function login() {
      var email = String(el('email').value || '').trim();
      var password = String(el('password').value || '');
      if (!email || !password) {
        setMsg('Informe email e senha.', 'err');
        return;
      }
      setMsg('Autenticando...', '');
      try {
        await RonecaPanelAuth.signIn(email, password);
        if (await routeAuthenticatedSession()) return;
        await RonecaPanelAuth.signOut();
        setMsg('Usuário autenticado, mas sem papel ativo no painel.', 'err');
      } catch (err) {
        await RonecaPanelAuth.signOut();
        setMsg(err && err.message ? err.message : 'Falha ao autenticar.', 'err');
      }
    }

    async function clearLogin() {
      await RonecaPanelAuth.signOut();
      el('email').value = '';
      el('password').value = '';
      setMsg('Sessão removida deste navegador.', 'ok');
    }

    el('password').addEventListener('keydown', function (event) {
      if (event.key === 'Enter') login();
    });

    if (RonecaPanelAuth.hasSession()) {
      setMsg('Restaurando sessão...', '');
      routeAuthenticatedSession().catch(async function () {
        await RonecaPanelAuth.signOut();
        setMsg('Sessão expirada. Entre novamente.', 'err');
      });
    }
  </script>
</body>
</html>
