<?xml version="1.0" encoding="UTF-8"?>
<svg width="1840" height="320" viewBox="0 0 1840 320" role="img" aria-labelledby="title description" xmlns="http://www.w3.org/2000/svg">
  <title id="title">Roneca Player TV</title>
