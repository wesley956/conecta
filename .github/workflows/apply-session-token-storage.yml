name: Apply Session-only Token Storage

on:
  push:
    branches:
      - agent/security-session-only-panel-tokens

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/security-session-only-panel-tokens
          fetch-depth: 0

      - name: Replace persistent token storage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('admin-panel/index.html'),
              Path('admin-panel/dashboard.html'),
              Path('admin-panel/seller.html'),
              Path('admin-panel/seller-lists-ux.js'),
              Path('admin-panel/seller-portal-ux.js'),
              Path('public/vendedor.html'),
          ]

          total = 0
          for path in paths:
              source = path.read_text(encoding='utf-8')
              occurrences = source.count('localStorage')
              if occurrences == 0:
                  continue

              source = source.replace('localStorage', 'sessionStorage')
              path.write_text(source, encoding='utf-8')
              total += occurrences
              print(f'{path}: {occurrences} ocorrência(s) migrada(s)')

          if total == 0:
              raise SystemExit('Nenhuma referência de armazenamento persistente foi encontrada.')
          PY

      - name: Validate JavaScript files
        shell: bash
        run: |
          node --check admin-panel/seller-lists-ux.js
          node --check admin-panel/seller-portal-ux.js

      - name: Verify token keys are not persisted
        shell: bash
        run: |
          set -euo pipefail

          if grep -RInE 'localStorage.*(cruz-stars-admin-token|roneca_seller_token)|localStorage\.(getItem|setItem|removeItem)\((ADMIN_KEY|SELLER_KEY|KEY|TOKEN_KEY)' \
            admin-panel public/vendedor.html; then
            echo 'Token persistente ainda encontrado.'
            exit 1
          fi

      - name: Commit generated patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-panel public/vendedor.html
          git commit -m 'security: keep panel tokens in session storage'
          git push origin HEAD:agent/security-session-only-panel-tokens
