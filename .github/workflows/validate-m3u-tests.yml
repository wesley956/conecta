name: Validate M3U Robustness Tests

on:
  pull_request:
    branches:
      - agent/runner-m3u-tests-base

permissions:
  contents: read

jobs:
  parser-tests:
    if: github.head_ref == 'agent/tests-m3u-parser-robustness'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tests-m3u-parser-robustness

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check:m3u-parser
      - run: npm run typecheck
