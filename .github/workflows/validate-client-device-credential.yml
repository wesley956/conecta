name: Validate Client Device Credential

on:
  push:
    branches:
      - agent/security-client-device-credential

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-client-device-credential
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck

      - name: Record successful validation
        shell: bash
        run: |
          mkdir -p .validation
          printf 'typecheck passed for client device credential at %s\n' "$(date -u +%FT%TZ)" > .validation/client-device-credential.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .validation/client-device-credential.txt
          git commit -m 'test: validate client device credential'
          git push origin HEAD:agent/security-client-device-credential
