name: Apply automatic device credential migration

on:
  push:
    branches:
      - agent/fix-auto-device-credential-migration

permissions:
  contents: write

concurrency:
  group: apply-auto-device-credential-migration
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-auto-device-credential-migration
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply focused codemod
        run: node scripts/apply-auto-device-credential-migration.cjs

      - name: Validate application
        run: |
          npm run verify
          git diff --check

      - name: Commit functional change
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo 'Nenhuma alteração pendente.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/utils/devicePanel.ts
          git commit -m 'fix: emitir credencial automaticamente em aparelhos existentes'
          git push origin HEAD:agent/fix-auto-device-credential-migration
