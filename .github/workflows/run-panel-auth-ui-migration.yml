name: Run Panel Auth UI Migration

on:
  pull_request:
    branches:
      - agent/runner-panel-auth-ui-base

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/frontend-panel-supabase-auth' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontend-panel-supabase-auth
          fetch-depth: 0

      - name: Extract and execute UI codemod
        shell: bash
        run: |
          awk '
            /python - <<'"'"'PY'"'"'/ { capture=1; next }
            capture && /^          PY$/ { capture=0; exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-panel-auth-ui.yml > /tmp/codemod.py
          python /tmp/codemod.py

      - name: Remove the remaining legacy admin header
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('admin-panel/dashboard.html')
          source = path.read_text(encoding='utf-8')
          old = "      'Accept': 'application/json',\n      'x-admin-token': token()\n"
          new = "      'Accept': 'application/json'\n"

          if old in source:
              source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
          PY

      - name: Validate local auth client and generated config
        shell: bash
        run: |
          set -euo pipefail
          node --check admin-panel/panel-auth-session.js
          SUPABASE_URL=https://example.supabase.co \
          SUPABASE_ANON_KEY=public-anon-key-for-build-validation-only-1234567890 \
          node scripts/generate-panel-config.mjs

          if grep -RInE 'id="accessToken"|id="sellerToken"|x-admin-token|x-seller-token' \
            admin-panel/index.html admin-panel/dashboard.html admin-panel/seller.html; then
            echo 'Autenticação legada ainda encontrada nas páginas migradas.'
            exit 1
          fi

          grep -q 'id="email"' admin-panel/index.html
          grep -q 'id="password"' admin-panel/index.html
          grep -q 'id="sellerEmail"' admin-panel/seller.html
          grep -q 'id="sellerPassword"' admin-panel/seller.html

      - name: Commit validated change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-panel/index.html admin-panel/dashboard.html admin-panel/seller.html
          git commit -m 'frontend: migrate panel login to Supabase Auth'
          git push origin HEAD:agent/frontend-panel-supabase-auth
