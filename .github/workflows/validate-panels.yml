name: Validate Admin and Seller Panels

on:
  pull_request:
    paths:
      - "admin-panel/**"
      - "public/vendedor.html"
      - "scripts/check-panels.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-panels.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-panels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static audit and application build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Audit panel structure
        shell: bash
        run: |
          set +e
          npm run check:panels > panel-audit.log 2>&1
          STATUS=$?
          cat panel-audit.log
          exit $STATUS

      - name: Upload panel audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panel-audit-report
          path: panel-audit.log
          if-no-files-found: warn
          retention-days: 7

      - name: Validate parser, TypeScript and application build
        run: |
          npm run check:m3u-parser
          npm run typecheck
          npm run build
