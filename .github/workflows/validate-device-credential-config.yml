name: Validate Device Credential Config

on:
  push:
    branches:
      - agent/security-require-device-credential

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-require-device-credential
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check configuration function
        run: deno check supabase/functions/device-config/index.ts

      - name: Record successful validation
        shell: bash
        run: |
          mkdir -p .validation
          printf 'deno check passed for device-config at %s\n' "$(date -u +%FT%TZ)" > .validation/device-credential-config.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .validation/device-credential-config.txt
          git commit -m 'test: validate device credential config'
          git push origin HEAD:agent/security-require-device-credential
