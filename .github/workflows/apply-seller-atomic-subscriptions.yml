name: Apply seller atomic subscriptions

on:
  push:
    branches:
      - agent/backend-seller-atomic-subscriptions

permissions:
  contents: write

concurrency:
  group: apply-seller-atomic-subscriptions
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/backend-seller-atomic-subscriptions
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Apply focused codemod
        run: node scripts/apply-seller-atomic-subscriptions.cjs

      - name: Validate seller flow
        run: |
          node --check admin-panel/seller-portal-ux.js
          deno check supabase/functions/seller-panel/index.ts
          npm run verify
          git diff --check

      - name: Commit functional changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo 'Nenhuma alteração pendente.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-panel/seller-portal-ux.js supabase/functions/seller-panel/index.ts
          git commit -m 'backend: usar transação atômica em ativações do vendedor'
          git push origin HEAD:agent/backend-seller-atomic-subscriptions
