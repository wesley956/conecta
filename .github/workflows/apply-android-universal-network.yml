name: Apply Android universal network policy

on:
  push:
    branches:
      - agent/universal-playlist-registration
    paths:
      - scripts/patch-android-universal-network.py
      - .android-universal-trigger

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/universal-playlist-registration
          fetch-depth: 0

      - name: Adjust import patch for both player screens
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/patch-android-universal-network.py')
          source = path.read_text()
          old = """for path in ['native-android/app/src/main/java/com/ronecaplaytv/nativeapp/ui/player/NativePlayerScreen.kt','native-android/app/src/main/java/com/ronecaplaytv/nativeapp/ui/player/SeriesNativePlayerScreen.kt']:\n    rep(path,'import androidx.media3.datasource.DefaultHttpDataSource\\n','import androidx.media3.datasource.okhttp.OkHttpDataSource\\n')\n    rep(path,'import com.ronecaplaytv.nativeapp.catalog.','import com.ronecaplaytv.nativeapp.network.SourceNetworkPolicyRegistry\\nimport com.ronecaplaytv.nativeapp.network.SourceNetworkScope\\nimport com.ronecaplaytv.nativeapp.catalog.')\n"""
          new = """native_player='native-android/app/src/main/java/com/ronecaplaytv/nativeapp/ui/player/NativePlayerScreen.kt'\nseries_player='native-android/app/src/main/java/com/ronecaplaytv/nativeapp/ui/player/SeriesNativePlayerScreen.kt'\nfor path in [native_player, series_player]:\n    rep(path,'import androidx.media3.datasource.DefaultHttpDataSource\\n','import androidx.media3.datasource.okhttp.OkHttpDataSource\\n')\nrep(native_player,'import com.ronecaplaytv.nativeapp.catalog.NativeChannel\\n','import com.ronecaplaytv.nativeapp.catalog.NativeChannel\\nimport com.ronecaplaytv.nativeapp.network.SourceNetworkPolicyRegistry\\nimport com.ronecaplaytv.nativeapp.network.SourceNetworkScope\\n')\nrep(series_player,'import com.ronecaplaytv.nativeapp.catalog.NativeEpisode\\n','import com.ronecaplaytv.nativeapp.catalog.NativeEpisode\\nimport com.ronecaplaytv.nativeapp.network.SourceNetworkPolicyRegistry\\nimport com.ronecaplaytv.nativeapp.network.SourceNetworkScope\\n')\n"""
          if source.count(old) != 1:
              raise SystemExit('O bloco antigo de imports não foi encontrado exatamente uma vez.')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Apply guarded patches
        run: python scripts/patch-android-universal-network.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Compile Android debug and release
        working-directory: native-android
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Commit verified integration
        run: |
          rm -f scripts/patch-android-universal-network.py
          rm -f .github/workflows/apply-android-universal-network.yml
          rm -f .android-universal-trigger
          git config user.name "roneca-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(android): apply source-scoped TLS compatibility"
          git push origin HEAD:agent/universal-playlist-registration
