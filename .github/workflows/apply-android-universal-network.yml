name: Apply Android universal network policy

on:
  push:
    branches:
      - agent/universal-playlist-registration
    paths:
      - scripts/patch-android-universal-network.py

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/universal-playlist-registration
          fetch-depth: 0

      - name: Apply guarded patches
        run: python scripts/patch-android-universal-network.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Compile Android debug and release
        working-directory: native-android
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Commit verified integration
        run: |
          rm -f scripts/patch-android-universal-network.py
          rm -f .github/workflows/apply-android-universal-network.yml
          git config user.name "roneca-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(android): apply source-scoped TLS compatibility"
          git push origin HEAD:agent/universal-playlist-registration
