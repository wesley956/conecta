name: Database PR diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - '.github/workflows/database-pr-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      OPENAI_API_KEY: unused-in-ci

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --silent

      - name: Start local database
        run: npx supabase db start

      - name: Reapply migrations
        run: npx supabase db reset --local --no-seed

      - name: Capture lint report
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx supabase db lint --local --schema public --level error --fail-on error 2>&1 | tee database-lint.log

      - name: Capture pgTAP report
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx supabase test db --local 2>&1 | tee database-tests.log

      - name: Upload database reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subscription-database-diagnostics
          path: |
            database-lint.log
            database-tests.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail when validation failed
        if: steps.lint.outcome != 'success' || steps.tests.outcome != 'success'
        run: exit 1

      - name: Stop local database
        if: always()
        run: npx supabase stop --no-backup
