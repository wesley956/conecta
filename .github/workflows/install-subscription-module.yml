name: Install subscription module in panels

on:
  push:
    branches:
      - feature/subscriptions-lab-security
    paths:
      - '.github/workflows/install-subscription-module.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/subscriptions-lab-security
          fetch-depth: 0

      - name: Add stylesheet and script to both authenticated panels
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for name in ['admin-panel/dashboard.html', 'admin-panel/seller.html']:
              path = Path(name)
              text = path.read_text()
              css = '  <link rel="stylesheet" href="./subscription-module.css?v=3.0" />\n'
              script = '  <script defer src="./subscription-module.js?v=3.0"></script>\n'
              if 'subscription-module.css' not in text:
                  text = text.replace('</head>', css + '</head>', 1)
              if 'subscription-module.js' not in text:
                  text = text.replace('</body>', script + '</body>', 1)
              path.write_text(text)
          PY
          grep -q 'subscription-module.js' admin-panel/dashboard.html
          grep -q 'subscription-module.js' admin-panel/seller.html

      - name: Remove temporary workflow and push
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/install-subscription-module.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-panel/dashboard.html admin-panel/seller.html
          git commit -m 'Carregar módulo de assinaturas nos painéis'
          git push origin HEAD:feature/subscriptions-lab-security
