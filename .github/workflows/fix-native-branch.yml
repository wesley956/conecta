name: Fix native branch source

on:
  push:
    branches:
      - feature/native-only-platform-v3

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/native-only-platform-v3
          fetch-depth: 0

      - name: Correct Android headset key constant
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/KEYCODE_HEADSETPHOOK/KEYCODE_HEADSETHOOK/g' \
            native-android/app/src/main/java/com/ronecaplaytv/nativeapp/ui/player/NativePlayerScreen.kt \
            native-android/app/src/main/java/com/ronecaplaytv/nativeapp/ui/player/SeriesNativePlayerScreen.kt
          ! grep -R 'KEYCODE_HEADSETPHOOK' native-android/app/src/main/java/com/ronecaplaytv/nativeapp/ui/player

      - name: Remove temporary workflow and push correction
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-native-branch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native-android/app/src/main/java/com/ronecaplaytv/nativeapp/ui/player/NativePlayerScreen.kt
          git add native-android/app/src/main/java/com/ronecaplaytv/nativeapp/ui/player/SeriesNativePlayerScreen.kt
          git commit -m 'Corrigir constante do botão físico de mídia'
          git push origin HEAD:feature/native-only-platform-v3
