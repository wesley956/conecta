name: Apply Panel Auth UI

on:
  push:
    branches:
      - agent/frontend-panel-supabase-auth

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontend-panel-supabase-auth
          fetch-depth: 0

      - name: Migrate admin and seller pages to Supabase Auth
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # ----- Unified login page -----
          index_path = Path('admin-panel/index.html')
          source = index_path.read_text(encoding='utf-8')

          old_fields = """      <label for="accessToken">Token de acesso</label>
      <input id="accessToken" type="password" autocomplete="off" placeholder="Digite seu token" />"""
          new_fields = """      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" placeholder="seu@email.com" />

      <label for="password">Senha</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" />"""

          if source.count(old_fields) != 1:
              raise SystemExit('Campos antigos do login unificado não encontrados.')
          source = source.replace(old_fields, new_fields, 1)

          scripts = '  <script src="./panel-config.js"></script>\n  <script src="./panel-auth-session.js"></script>\n'
          inline_start = '  <script>\n    var ADMIN_API'
          if scripts not in source:
              if source.count(inline_start) != 1:
                  raise SystemExit('Início do script de login não encontrado.')
              source = source.replace(inline_start, scripts + inline_start, 1)

          script_start = source.find(inline_start)
          script_end = source.find('  </script>\n</body>', script_start)
          if script_start < 0 or script_end < 0:
              raise SystemExit('Bloco do script de login não encontrado.')

          login_script = """  <script>
    var ADMIN_API = 'https://awauvkjkucjqulkklmuo.supabase.co/functions/v1/admin-panel';
    var SELLER_API = 'https://awauvkjkucjqulkklmuo.supabase.co/functions/v1/seller-panel';

    function el(id) {
      return document.getElementById(id);
    }

    function setMsg(text, cls) {
      el('msg').textContent = text;
      el('msg').className = 'msg ' + (cls || '');
    }

    async function callRoleApi(api, action) {
      var res = await fetch(api, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: action })
      });

      if (!res.ok) return false;
      await res.json().catch(function () { return {}; });
      return true;
    }

    async function routeAuthenticatedSession() {
      if (await callRoleApi(ADMIN_API, 'listCommercialData')) {
        window.location.href = './dashboard.html';
        return true;
      }

      if (await callRoleApi(SELLER_API, 'dashboard')) {
        window.location.href = './seller.html';
        return true;
      }

      return false;
    }

    async function login() {
      var email = String(el('email').value || '').trim();
      var password = String(el('password').value || '');

      if (!email || !password) {
        setMsg('Informe email e senha.', 'err');
        return;
      }

      setMsg('Autenticando...', '');

      try {
        await RonecaPanelAuth.signIn(email, password);

        if (await routeAuthenticatedSession()) return;

        await RonecaPanelAuth.signOut();
        setMsg('Usuário autenticado, mas sem papel ativo no painel.', 'err');
      } catch (err) {
        await RonecaPanelAuth.signOut();
        setMsg(err && err.message ? err.message : 'Falha ao autenticar.', 'err');
      }
    }

    async function clearLogin() {
      await RonecaPanelAuth.signOut();
      el('email').value = '';
      el('password').value = '';
      setMsg('Sessão removida deste navegador.', 'ok');
    }

    el('password').addEventListener('keydown', function (event) {
      if (event.key === 'Enter') login();
    });

    if (RonecaPanelAuth.hasSession()) {
      setMsg('Restaurando sessão...', '');
      routeAuthenticatedSession().catch(async function () {
        await RonecaPanelAuth.signOut();
        setMsg('Sessão expirada. Entre novamente.', 'err');
      });
    }
  </script>
"""
          source = source[:script_start] + login_script + source[script_end + len('  </script>\n'):]
          index_path.write_text(source, encoding='utf-8')

          # ----- Admin dashboard -----
          dashboard_path = Path('admin-panel/dashboard.html')
          source = dashboard_path.read_text(encoding='utf-8')
          scripts = '<script src="./panel-config.js"></script>\n<script src="./panel-auth-session.js"></script>\n'
          marker = '<script>\nconst API = '
          if scripts not in source:
              if source.count(marker) != 1:
                  raise SystemExit('Script principal do dashboard não encontrado.')
              source = source.replace(marker, scripts + marker, 1)

          source = re.sub(
              r"const KEY = 'cruz-stars-admin-token';\s*",
              '',
              source,
              count=1,
          )

          token_pattern = re.compile(
              r"function token\(\) \{\s*return sessionStorage\.getItem\(KEY\) \|\| '';\s*\}",
              re.MULTILINE,
          )
          source, replacements = token_pattern.subn(
              "function token() {\n  return RonecaPanelAuth.hasSession() ? 'authenticated-session' : '';\n}",
              source,
              count=1,
          )
          if replacements != 1:
              raise SystemExit('Função token do dashboard não encontrada.')

          logout_pattern = re.compile(
              r"function logout\(\) \{.*?\n\}",
              re.DOTALL,
          )
          logout_match = logout_pattern.search(source)
          if not logout_match:
              raise SystemExit('Função logout do dashboard não encontrada.')
          source = source[:logout_match.start()] + """async function logout() {
  await RonecaPanelAuth.signOut();
  window.location.href = './index.html';
}""" + source[logout_match.end():]
          dashboard_path.write_text(source, encoding='utf-8')

          # ----- Seller portal -----
          seller_path = Path('admin-panel/seller.html')
          source = seller_path.read_text(encoding='utf-8')

          old_fields = """      <label for="sellerToken">Token do vendedor</label>
      <input id="sellerToken" type="password" autocomplete="off" placeholder="Cole o token recebido pelo administrador" />"""
          new_fields = """      <label for="sellerEmail">Email</label>
      <input id="sellerEmail" type="email" autocomplete="username" placeholder="seu@email.com" />

      <label for="sellerPassword">Senha</label>
      <input id="sellerPassword" type="password" autocomplete="current-password" placeholder="Digite sua senha" />"""
          if source.count(old_fields) != 1:
              raise SystemExit('Campos antigos do vendedor não encontrados.')
          source = source.replace(old_fields, new_fields, 1)

          scripts = '  <script src="./panel-config.js"></script>\n  <script src="./panel-auth-session.js"></script>\n'
          marker = '  <script>\n    const API = '
          if scripts not in source:
              if source.count(marker) != 1:
                  raise SystemExit('Script principal do vendedor não encontrado.')
              source = source.replace(marker, scripts + marker, 1)

          source = re.sub(
              r"\s*const TOKEN_KEY = 'roneca_seller_token';",
              '',
              source,
              count=1,
          )

          source = source.replace('async function fetchPortal(token) {', 'async function fetchPortal() {', 1)
          source = source.replace(
              "          'Content-Type': 'application/json',\n          'x-seller-token': token",
              "          'Content-Type': 'application/json'",
              1,
          )

          login_start = source.find('    async function login() {')
          load_start = source.find('\n\n    async function loadPortal() {', login_start)
          filtered_start = source.find('\n\n    function filteredDevices() {', load_start)
          if login_start < 0 or load_start < 0 or filtered_start < 0:
              raise SystemExit('Fluxo login/loadPortal do vendedor não encontrado.')

          auth_flow = """    async function login() {
      const email = $('sellerEmail').value.trim();
      const password = $('sellerPassword').value;

      if (!email || !password) {
        $('loginMsg').textContent = 'Informe email e senha.';
        return;
      }

      try {
        await RonecaPanelAuth.signIn(email, password);
        const data = await fetchPortal();
        renderPortal(data);
      } catch (err) {
        await RonecaPanelAuth.signOut();
        $('loginMsg').textContent = err.message || 'Acesso inválido.';
      }
    }

    async function loadPortal() {
      if (!RonecaPanelAuth.hasSession()) {
        $('loginView').classList.remove('hide');
        $('dashboardView').classList.add('hide');
        return;
      }

      try {
        const data = await fetchPortal();
        renderPortal(data);
      } catch (err) {
        await RonecaPanelAuth.signOut();
        $('loginMsg').textContent = err.message || 'Faça login novamente.';
        $('loginView').classList.remove('hide');
        $('dashboardView').classList.add('hide');
      }
    }"""
          source = source[:login_start] + auth_flow + source[filtered_start:]

          logout_pattern = re.compile(
              r"    function logout\(\) \{.*?\n    \}",
              re.DOTALL,
          )
          source, replacements = logout_pattern.subn(
              """    async function logout() {
      await RonecaPanelAuth.signOut();
      $('sellerPassword').value = '';
      $('loginView').classList.remove('hide');
      $('dashboardView').classList.add('hide');
    }""",
              source,
              count=1,
          )
          if replacements != 1:
              raise SystemExit('Logout do vendedor não encontrado.')

          source = source.replace(
              "    if ($('sellerToken')) $('sellerToken').addEventListener('keydown', event => {",
              "    if ($('sellerPassword')) $('sellerPassword').addEventListener('keydown', event => {",
              1,
          )
          seller_path.write_text(source, encoding='utf-8')
          PY

      - name: Validate generated JavaScript
        run: |
          node --check admin-panel/panel-auth-session.js
          node scripts/generate-panel-config.mjs
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: public-anon-key-for-build-validation-only-1234567890

      - name: Verify legacy token fields were removed
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE 'accessToken|sellerToken|x-admin-token|x-seller-token' \
            admin-panel/index.html admin-panel/dashboard.html admin-panel/seller.html

      - name: Commit generated patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-panel/index.html admin-panel/dashboard.html admin-panel/seller.html
          git commit -m 'frontend: migrate panel login to Supabase Auth'
          git push origin HEAD:agent/frontend-panel-supabase-auth
