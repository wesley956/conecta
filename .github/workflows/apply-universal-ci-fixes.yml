name: Apply universal CI fixes

on:
  push:
    branches:
      - agent/universal-playlist-registration

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/universal-playlist-registration
          fetch-depth: 0

      - name: Qualify SQL columns and configure Deno npm resolution
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          paths = [
              Path('supabase/migrations/20260805210500_universal_playlist_sources.sql'),
              Path('supabase/migrations/20260806012800_universal_playlist_shared_source_guard.sql'),
          ]
          for path in paths:
              source = path.read_text()
              old = """  update public.panel_playlist_endpoints
            set is_primary = false,
                updated_at = v_now
            where playlist_id = v_playlist_id;
          """
              new = """  update public.panel_playlist_endpoints endpoint
            set is_primary = false,
                updated_at = v_now
            where endpoint.playlist_id = v_playlist_id;
          """
              assert old in source, path
              source = source.replace(old, new, 1)

              old = """  update public.panel_playlist_endpoints
            set is_primary = (id = v_first_endpoint_id),
                updated_at = v_now
            where playlist_id = v_playlist_id;
          """
              new = """  update public.panel_playlist_endpoints endpoint
            set is_primary = (endpoint.id = v_first_endpoint_id),
                updated_at = v_now
            where endpoint.playlist_id = v_playlist_id;
          """
              assert old in source, path
              source = source.replace(old, new, 1)
              path.write_text(source)

          Path('deno.json').write_text('''{
            "nodeModulesDir": "auto"
          }
          ''')
          PY

          node scripts/check-migration-versions.mjs

      - name: Commit CI corrections
        shell: bash
        run: |
          rm .github/workflows/apply-universal-ci-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: qualificar SQL e habilitar resolução npm no Deno"
          git push origin HEAD:agent/universal-playlist-registration
