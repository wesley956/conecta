name: Apply owner role compatibility

on:
  push:
    branches:
      - feature/subscriptions-lab-security
    paths:
      - '.github/workflows/apply-owner-compat.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/subscriptions-lab-security
          fetch-depth: 0

      - name: Add owner to existing administrative endpoints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          admin_files = [
              'supabase/functions/admin-panel/index.ts',
              'supabase/functions/admin-inline-playlist/index.ts',
              'supabase/functions/seller-provision/index.ts',
              'supabase/functions/seller-delete/index.ts',
          ]
          for name in admin_files:
              path = Path(name)
              text = path.read_text()
              text = text.replace("['admin']", "['owner', 'admin']")
              path.write_text(text)

          finance = Path('supabase/functions/finance-panel/index.ts')
          text = finance.read_text()
          text = text.replace("role: 'admin' | 'seller';", "role: 'owner' | 'admin' | 'seller';")
          text = text.replace("['admin', 'seller']", "['owner', 'admin', 'seller']")
          text = text.replace("principal.role !== 'admin'", "!['owner', 'admin'].includes(principal.role)")
          text = text.replace("principal.role === 'admin' ? sellerSummary(result.records) : []", "principal.role !== 'seller' ? sellerSummary(result.records) : []")
          finance.write_text(text)

          auth = Path('admin-panel/panel-auth-session.js')
          text = auth.read_text()
          text = text.replace("'seller-panel': true,", "'seller-panel': true,\n    'subscription-panel': true,")
          text = text.replace("(admin-panel|seller-panel)", "(admin-panel|seller-panel|subscription-panel)")
          auth.write_text(text)

          # Preserve current checks while accepting owner as an administrative role.
          for name in [
              'scripts/check-finance-module.mjs',
              'scripts/check-inline-playlist-activation.mjs',
              'scripts/check-seller-provisioning.mjs',
          ]:
              path = Path(name)
              text = path.read_text()
              text = text.replace("['admin']", "['owner', 'admin']")
              text = text.replace("['admin', 'seller']", "['owner', 'admin', 'seller']")
              path.write_text(text)
          PY

          grep -R "requirePanelPrincipal.*\['admin'\]" supabase/functions/admin-panel supabase/functions/admin-inline-playlist supabase/functions/seller-provision supabase/functions/seller-delete && exit 1 || true
          grep -q "'subscription-panel': true" admin-panel/panel-auth-session.js

      - name: Remove temporary workflow and push
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-owner-compat.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions admin-panel/panel-auth-session.js scripts
          git commit -m 'Compatibilizar proprietário com endpoints administrativos'
          git push origin HEAD:feature/subscriptions-lab-security
