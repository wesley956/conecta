name: Deploy Admin Panel to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "admin-panel/**"
      - "scripts/generate-panel-config.mjs"
      - "package.json"
      - ".github/workflows/deploy-admin-panel.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_PANEL_AUTO_DEPLOY == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate public Supabase config
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
        run: |
          node scripts/generate-panel-config.mjs
          test -s admin-panel/panel-config.js
          node --check admin-panel/panel-auth-session.js

      - name: Prepare static files
        run: |
          test -f admin-panel/index.html
          touch admin-panel/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload admin panel
        uses: actions/upload-pages-artifact@v3
        with:
          path: admin-panel

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
