name: Deploy Admin Panel to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "admin-panel/**"
      - "public/vendedor.html"
      - "scripts/check-panels.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-admin-panel.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate admin and seller panels
        run: npm run check:panels

      - name: Prepare static files
        run: |
          test -f admin-panel/index.html
          test -f admin-panel/dashboard.html
          test -f admin-panel/seller.html
          touch admin-panel/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload admin panel
        uses: actions/upload-pages-artifact@v3
        with:
          path: admin-panel

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
