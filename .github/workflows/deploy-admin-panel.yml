name: Deploy Admin Panel to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "admin-panel/**"
      - "scripts/generate-panel-config.mjs"
      - "package.json"
      - ".github/workflows/deploy-admin-panel.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate public Supabase config
        env:
          # Estes valores são públicos por design e são enviados ao navegador.
          # A chave service_role nunca é usada ou exposta neste workflow.
          SUPABASE_URL: https://awauvkjkucjqulkklmuo.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_QhNyg55ZhiOCPZyuSjsX8A_Kq7nTiYN
        run: |
          node scripts/generate-panel-config.mjs
          test -s admin-panel/panel-config.js
          node --check admin-panel/panel-auth-session.js
          node --check admin-panel/seller-provisioning.js
          node --check admin-panel/panel-config.js
          grep -F "seller-provisioning.js" admin-panel/panel-config.js

      - name: Prepare static files
        run: |
          test -f admin-panel/index.html
          test -f admin-panel/seller-provisioning.js
          touch admin-panel/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload admin panel
        uses: actions/upload-pages-artifact@v3
        with:
          path: admin-panel

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
