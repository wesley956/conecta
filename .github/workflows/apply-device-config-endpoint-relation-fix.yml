name: Apply device config endpoint relation fix

on:
  push:
    branches:
      - fix/device-config-endpoint-relation
    paths:
      - '.github/workflows/apply-device-config-endpoint-relation-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/device-config-endpoint-relation
          token: ${{ github.token }}
      - name: Patch ambiguous PostgREST relationship
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/device-config-qualified/index.ts')
          text = path.read_text()
          old = 'endpoints:panel_playlist_endpoints('
          new = 'endpoints:panel_playlist_endpoints!panel_playlist_endpoints_playlist_id_fkey('
          if old not in text:
              raise SystemExit('Target relationship not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/apply-device-config-endpoint-relation-fix.yml
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/device-config-qualified/index.ts .github/workflows/apply-device-config-endpoint-relation-fix.yml
          git commit -m 'fix: disambiguate playlist endpoint relationship'
          git push origin HEAD:fix/device-config-endpoint-relation
