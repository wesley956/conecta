name: Publish native RonecaPlayTV release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Resumo desta versão nativa'
        required: false
        default: 'Melhorias do aplicativo Android nativo.'

permissions:
  contents: write

concurrency:
  group: native-android-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish immutable native APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Validate native-only platform
        run: node scripts/check-native-only.mjs

      - name: Read application version
        id: app
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' native-android/app/build.gradle.kts | head -n1)
          VERSION_CODE=$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)/\1/p' native-android/app/build.gradle.kts | head -n1)
          test -n "$VERSION"
          test -n "$VERSION_CODE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        id: notes
        env:
          INPUT_RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES_FILE="$RUNNER_TEMP/ronecaplaytv-release-notes.md"
          if [ -n "${INPUT_RELEASE_NOTES:-}" ]; then
            printf '%s\n' "$INPUT_RELEASE_NOTES" > "$NOTES_FILE"
          else
            cp native-android/RELEASE_NOTES.md "$NOTES_FILE"
          fi
          test -s "$NOTES_FILE"
          echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Refuse mutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.app.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A release $TAG já existe. Aumente versionName e versionCode antes de publicar."
            exit 1
          fi

      - name: Restore permanent release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.NATIVE_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NATIVE_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.NATIVE_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.NATIVE_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing NATIVE_ANDROID_KEYSTORE_BASE64 secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing NATIVE_ANDROID_KEYSTORE_PASSWORD secret}"
          : "${ANDROID_KEY_ALIAS:?Missing NATIVE_ANDROID_KEY_ALIAS secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing NATIVE_ANDROID_KEY_PASSWORD secret}"

          KEYSTORE_FILE="$RUNNER_TEMP/ronecaplaytv-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"

          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Assemble signed release APK
        working-directory: native-android
        shell: bash
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify signature and prepare release files
        env:
          EXPECTED_SIGNER_SHA256: ${{ secrets.NATIVE_ANDROID_SIGNING_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          : "${EXPECTED_SIGNER_SHA256:?Missing NATIVE_ANDROID_SIGNING_CERT_SHA256 secret}"

          mkdir -p release
          APK="release/ronecaPlayerTV-v${{ steps.app.outputs.version }}.apk"
          cp native-android/app/build/outputs/apk/release/app-release.apk "$APK"

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK"
          ACTUAL_SIGNER_SHA256=$(
            "$APKSIGNER" verify --print-certs "$APK" |
              sed -n 's/^Signer #1 certificate SHA-256 digest: //p' |
              head -n1 |
              tr '[:upper:]' '[:lower:]' |
              tr -d ':'
          )
          NORMALIZED_EXPECTED=$(printf '%s' "$EXPECTED_SIGNER_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':')
          test "$ACTUAL_SIGNER_SHA256" = "$NORMALIZED_EXPECTED"

          APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')
          printf '%s  %s\n' "$APK_SHA256" "$(basename "$APK")" > "release/ronecaPlayerTV-v${{ steps.app.outputs.version }}.sha256"
          printf '%s\n' "$ACTUAL_SIGNER_SHA256" > release/ronecaPlayerTV-signing-cert.sha256

          jq -n \
            --argjson schemaVersion 1 \
            --argjson versionCode "${{ steps.app.outputs.version_code }}" \
            --arg versionName "${{ steps.app.outputs.version }}" \
            --arg apkUrl "https://github.com/${{ github.repository }}/releases/download/${{ steps.app.outputs.tag }}/ronecaPlayerTV-v${{ steps.app.outputs.version }}.apk" \
            --arg sha256 "$APK_SHA256" \
            --arg signerSha256 "$ACTUAL_SIGNER_SHA256" \
            --argjson mandatory false \
            --rawfile notes "${{ steps.notes.outputs.file }}" \
            '{
              schemaVersion: $schemaVersion,
              versionCode: $versionCode,
              versionName: $versionName,
              apkUrl: $apkUrl,
              sha256: $sha256,
              signerSha256: $signerSha256,
              mandatory: $mandatory,
              notes: $notes
            }' > release/ronecaPlayerTV-update.json

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.app.outputs.tag }}
          VERSION: ${{ steps.app.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "release/ronecaPlayerTV-v${VERSION}.apk" \
            "release/ronecaPlayerTV-v${VERSION}.sha256" \
            release/ronecaPlayerTV-update.json \
            release/ronecaPlayerTV-signing-cert.sha256 \
            --target "$GITHUB_SHA" \
            --title "ronecaPlayerTV v${VERSION}" \
            --notes-file "${{ steps.notes.outputs.file }}" \
            --latest
