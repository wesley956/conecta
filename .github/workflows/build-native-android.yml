name: Build Native Android

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ronecaplaytv-native-v1
    paths:
      - "native-android/**"
      - "scripts/patch-native-player-tv-controls.cjs"
      - ".github/workflows/build-native-android.yml"
  pull_request:
    paths:
      - "native-android/**"
      - "scripts/patch-native-player-tv-controls.cjs"
      - ".github/workflows/build-native-android.yml"

permissions:
  contents: read

concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile native APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Apply TV navigation fixes
        run: node scripts/patch-native-player-tv-controls.cjs

      - name: Assemble debug APK
        working-directory: native-android
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee native-gradle-build.log

      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RonecaPlayTV-Native-gradle-log
          path: native-android/native-gradle-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: RonecaPlayTV-Native-debug
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
