name: Build Native Android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native-android/**'
      - '.github/workflows/build-native-android.yml'

permissions:
  contents: read

jobs:
  build-native-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Configurar Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Validar e compilar APK universal
        run: >-
          gradle --no-daemon -p native-android
          :app:lintDebug
          :app:testDebugUnitTest
          :app:assembleDebug

      - name: Publicar APK nativo
        uses: actions/upload-artifact@v4
        with:
          name: RonecaPlayTV-native-universal-debug
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
