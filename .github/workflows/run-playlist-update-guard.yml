name: Run Playlist Update Guard

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/fix-store-playlist-update-not-found' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-store-playlist-update-not-found
          fetch-depth: 0

      - name: Extract and execute codemod
        shell: bash
        run: |
          awk '
            /python - <<'"'"'PY'"'"'/ { capture=1; next }
            capture && /^          PY$/ { capture=0; exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-playlist-update-guard.yml > /tmp/codemod.py
          python /tmp/codemod.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck

      - name: Commit validated change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/stores/appStore.ts
          git commit -m 'fix: report missing playlist updates'
          git push origin HEAD:agent/fix-store-playlist-update-not-found
