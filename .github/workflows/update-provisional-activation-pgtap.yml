name: Update provisional activation pgTAP
on:
  push:
    branches:
      - agent/activation-wizard-provisional
    paths:
      - .github/workflows/update-provisional-activation-pgtap.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/activation-wizard-provisional
      - name: Update qualification expectations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/tests/playlist_commercial_qualification_test.sql')
          s=p.read_text()

          old="""  (\n    '00000000-0000-0000-0000-00000000a302',\n    'RPTV-LABQ01',\n    'pending',\n    repeat('b', 64),\n    true\n  );\n"""
          new="""  (\n    '00000000-0000-0000-0000-00000000a302',\n    'RPTV-LABQ01',\n    'pending',\n    repeat('b', 64),\n    true\n  ),\n  (\n    '00000000-0000-0000-0000-00000000a303',\n    'RPTV-QUAL02',\n    'pending',\n    repeat('c', 64),\n    false\n  );\n"""
          if old not in s: raise SystemExit('device fixture block missing')
          s=s.replace(old,new,1)

          old="""select throws_ok(\n  $$select * from public.apply_device_subscription_transaction(\n    '00000000-0000-0000-0000-00000000a001',\n    '00000000-0000-0000-0000-00000000a301',\n    '00000000-0000-0000-0000-00000000a101',\n    '00000000-0000-0000-0000-00000000a202',\n    '2099-01-01 00:00:00+00',\n    'activation',\n    'qualification-test',\n    'pending-direct-must-fail',\n    null,\n    'Cliente Pendente',\n    true\n  )$$,\n  'P0001',\n  'Lista principal ainda não está homologada para ativação. Estado: aguardando teste no aparelho.',\n  'Lista direta pendente é rejeitada antes da cobrança'\n);\nselect is(\n  (select credit_balance from public.panel_sellers where id = '00000000-0000-0000-0000-00000000a001'),\n  10,\n  'Falha de homologação preserva o saldo'\n);\n"""
          new="""select lives_ok(\n  $$select * from public.apply_device_subscription_transaction(\n    '00000000-0000-0000-0000-00000000a001',\n    '00000000-0000-0000-0000-00000000a301',\n    '00000000-0000-0000-0000-00000000a101',\n    '00000000-0000-0000-0000-00000000a202',\n    '2099-01-01 00:00:00+00',\n    'activation',\n    'qualification-test',\n    'pending-direct-provisional-pass',\n    null,\n    'Cliente Provisório',\n    true\n  )$$,\n  'Android pode ser ativado provisoriamente enquanto o aplicativo confirma a lista'\n);\nselect is(\n  (select credit_balance from public.panel_sellers where id = '00000000-0000-0000-0000-00000000a001'),\n  8,\n  'Ativação provisória consome o crédito normal do plano'\n);\n"""
          if old not in s: raise SystemExit('old provisional rejection block missing')
          s=s.replace(old,new,1)

          s=s.replace("""select is(\n  (select count(*)::integer from public.panel_credit_ledger where seller_id = '00000000-0000-0000-0000-00000000a001'),\n  0,\n  'Sessão de validação não cria lançamento financeiro'\n);\n""", """select is(\n  (select count(*)::integer from public.panel_credit_ledger where seller_id = '00000000-0000-0000-0000-00000000a001'),\n  1,\n  'Sessão de validação não cria lançamento financeiro adicional'\n);\n""", 1)

          marker="""select lives_ok(\n  $$select * from public.apply_device_subscription_transaction(\n    '00000000-0000-0000-0000-00000000a001',\n    '00000000-0000-0000-0000-00000000a301',\n"""
          replacement="""select lives_ok(\n  $$select * from public.apply_device_subscription_transaction(\n    '00000000-0000-0000-0000-00000000a001',\n    '00000000-0000-0000-0000-00000000a303',\n"""
          pos=s.find(marker, s.find("'Lista direta comprovada fica homologada'"))
          if pos < 0: raise SystemExit('confirmed activation block missing')
          s=s[:pos]+s[pos:].replace(marker,replacement,1)

          old="""select is(\n  (select credit_balance from public.panel_sellers where id = '00000000-0000-0000-0000-00000000a001'),\n  8,\n  'Crédito é consumido somente após a homologação'\n);\nselect is(\n  (select status from public.panel_devices where id = '00000000-0000-0000-0000-00000000a301'),\n  'active',\n  'Aparelho comercial é ativado após a homologação'\n);\n"""
          new="""select is(\n  (select credit_balance from public.panel_sellers where id = '00000000-0000-0000-0000-00000000a001'),\n  6,\n  'Uma nova ativação confirmada consome o crédito normal do plano'\n);\nselect is(\n  (select status from public.panel_devices where id = '00000000-0000-0000-0000-00000000a303'),\n  'active',\n  'Outro aparelho comercial usa a lista já confirmada'\n);\n"""
          if old not in s: raise SystemExit('confirmed balance block missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          rm .github/workflows/update-provisional-activation-pgtap.yml
      - name: Commit updated pgTAP expectations
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/tests/playlist_commercial_qualification_test.sql .github/workflows/update-provisional-activation-pgtap.yml
          git commit -m "test: cover provisional Android activation"
          git push origin HEAD:agent/activation-wizard-provisional
