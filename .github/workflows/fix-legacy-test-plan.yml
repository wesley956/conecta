name: Fix legacy playlist test plan

on:
  push:
    branches:
      - hotfix/legacy-playlist-edit-production
    paths:
      - '.github/workflows/fix-legacy-test-plan.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/legacy-playlist-edit-production
          fetch-depth: 0
      - name: Correct pgTAP plan
        run: |
          sed -i 's/select plan(18);/select plan(19);/' supabase/tests/legacy_device_playlist_edit_test.sql
          grep -q 'select plan(19);' supabase/tests/legacy_device_playlist_edit_test.sql
      - name: Remove temporary workflow and push
        run: |
          git rm .github/workflows/fix-legacy-test-plan.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/tests/legacy_device_playlist_edit_test.sql
          git commit -m 'Corrigir contagem do pgTAP da edição atual'
          git push origin HEAD:hotfix/legacy-playlist-edit-production
