name: LG Review Final E2E Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-lg-review-final-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Simulate LG activation, catalog loading and playback access
        shell: bash
        run: |
          set -euo pipefail
          HTTP_STATUS=$(curl --silent --show-error --max-time 240 \
            'https://awauvkjkucjqulkklmuo.supabase.co/functions/v1/lg-review-e2e-check?token=OziAmE_xcrplMVmrXER8lQj6NOrmxdTI' \
            --output result.json \
            --write-out '%{http_code}')
          echo "HTTP ${HTTP_STATUS}"
          cat result.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('result.json').read_text())
          assert result.get('result') == 'PASS', result
          assert result['deviceActivate']['http'] == 200, result
          assert result['reviewStatus']['http'] == 200, result
          assert result['reviewActivate']['http'] == 200, result
          assert result['deviceConfig']['http'] == 200, result
          assert result['deviceConfig']['active'] is True, result
          assert result['deviceConfig']['playlistName'] == 'LG Review Demo', result
          assert 'lg-review-v2' in result['deviceConfig']['cacheVersion'], result
          assert result['catalogDownloads']['channels']['count'] == 1, result
          assert result['catalogDownloads']['movies']['count'] == 2, result
          assert result['catalogDownloads']['series']['count'] == 1, result
          assert result['media']['hls']['validManifest'] is True, result
          assert len(result['media']['videos']) == 2, result
          assert all(item['http'] in (200, 206) for item in result['media']['videos']), result
          assert all(item['bytesReceived'] == 65536 for item in result['media']['videos']), result
          assert all(item['mp4Signature'] is True for item in result['media']['videos']), result
          assert all(item['http'] == 200 and item['validSvg'] is True for item in result['media']['images']), result
          PY
