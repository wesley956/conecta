name: Blender Video Source Discovery

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-official-video-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read official PeerTube API
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request

          videos = {
              'big_buck_bunny': 'pAQiVCgv2CsLg79KKXUoMw',
              'sintel': '2PcJe5aZqozRvH7MJ8BTmC',
          }

          output = {}
          for name, video_id in videos.items():
              url = f'https://video.blender.org/api/v1/videos/{video_id}'
              request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 RonecaPlayTV-QA/1.0'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  payload = json.load(response)
              output[name] = {
                  'name': payload.get('name'),
                  'licence': payload.get('licence'),
                  'files': [
                      {
                          'resolution': item.get('resolution', {}).get('label'),
                          'size': item.get('size'),
                          'fileUrl': item.get('fileUrl'),
                          'fileDownloadUrl': item.get('fileDownloadUrl'),
                      }
                      for item in payload.get('files', [])
                  ],
                  'streamingPlaylists': [
                      {
                          'playlistUrl': playlist.get('playlistUrl'),
                          'files': [
                              {
                                  'resolution': item.get('resolution', {}).get('label'),
                                  'size': item.get('size'),
                                  'fileUrl': item.get('fileUrl'),
                                  'fileDownloadUrl': item.get('fileDownloadUrl'),
                              }
                              for item in playlist.get('files', [])
                          ],
                      }
                      for playlist in payload.get('streamingPlaylists', [])
                  ],
              }
          print(json.dumps(output, indent=2, ensure_ascii=False))
          PY
