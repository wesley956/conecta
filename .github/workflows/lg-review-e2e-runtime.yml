name: LG Review E2E Runtime Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-lg-review-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Execute activation and catalog flow
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 180 \
            'https://awauvkjkucjqulkklmuo.supabase.co/functions/v1/lg-review-e2e-check?token=OziAmE_xcrplMVmrXER8lQj6NOrmxdTI' \
            --output activation-result.json
          cat activation-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('activation-result.json').read_text())
          assert result['deviceActivate']['http'] == 200, result
          assert result['reviewStatus']['http'] == 200, result
          assert result['reviewActivate']['http'] == 200, result
          assert result['deviceConfig']['http'] == 200, result
          assert result['deviceConfig']['active'] is True, result
          assert result['deviceConfig']['playlistName'] == 'LG Review Demo', result
          assert result['catalogDownloads']['channels']['count'] == 1, result
          assert result['catalogDownloads']['movies']['count'] == 2, result
          assert result['catalogDownloads']['series']['count'] == 1, result
          PY

      - name: Verify media directly with player-style GET requests
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location --max-time 60 \
            'https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_ts/master.m3u8' \
            --output hls.m3u8
          grep -q '#EXTM3U' hls.m3u8

          check_video() {
            local name="$1"
            local url="$2"
            local output="${name}.bin"
            local metrics
            metrics=$(curl --silent --show-error --location --max-time 90 \
              --range 0-65535 \
              --header 'Accept: video/mp4,*/*' \
              --output "$output" \
              --write-out '%{http_code}|%{content_type}|%{size_download}' \
              "$url")
            echo "${name}: ${metrics}"
            python - "$output" "$metrics" <<'PY'
          import sys
          from pathlib import Path
          output = Path(sys.argv[1])
          status, content_type, size = sys.argv[2].split('|')
          assert status in {'200', '206'}, (status, content_type, size)
          assert output.stat().st_size > 0, output.stat().st_size
          PY
          }

          check_video current_bunny 'https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4'
          check_video current_sintel 'https://storage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4'
          check_video alternate_bunny 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4'
          check_video alternate_sintel 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4'

          for image in live-demo big-buck-bunny sintel; do
            curl --fail --silent --show-error --location --max-time 30 \
              "https://conecta-five-iota.vercel.app/lg-review/assets/${image}.svg" \
              --output "${image}.svg"
            grep -qi '<svg' "${image}.svg"
          done
