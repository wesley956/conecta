name: Blender Video 480p Verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-official-480p-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve and probe official Blender MP4 files
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request

          videos = {
              'big_buck_bunny': 'pAQiVCgv2CsLg79KKXUoMw',
              'sintel': '2PcJe5aZqozRvH7MJ8BTmC',
          }

          output = {}
          for name, video_id in videos.items():
              api_url = f'https://video.blender.org/api/v1/videos/{video_id}'
              req = urllib.request.Request(api_url, headers={'User-Agent': 'Mozilla/5.0 RonecaPlayTV-QA/1.0'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  payload = json.load(response)
              files = payload.get('files', [])
              selected = next((item for item in files if item.get('resolution', {}).get('label') == '480p'), None)
              if selected is None:
                  selected = next((item for item in files if item.get('resolution', {}).get('label') == '360p'), None)
              assert selected and selected.get('fileUrl'), (name, files)

              media_url = selected['fileUrl']
              media_req = urllib.request.Request(
                  media_url,
                  headers={
                      'User-Agent': 'Mozilla/5.0 RonecaPlayTV-QA/1.0',
                      'Range': 'bytes=0-65535',
                      'Accept': 'video/mp4,*/*',
                  },
              )
              with urllib.request.urlopen(media_req, timeout=90) as response:
                  data = response.read(65536)
                  output[name] = {
                      'title': payload.get('name'),
                      'resolution': selected.get('resolution', {}).get('label'),
                      'url': media_url,
                      'http': response.status,
                      'content_type': response.headers.get('content-type'),
                      'content_range': response.headers.get('content-range'),
                      'bytes': len(data),
                      'mp4_signature': len(data) >= 8 and data[4:8] == b'ftyp',
                  }

          print(json.dumps(output, indent=2, ensure_ascii=False))
          assert all(item['http'] in {200, 206} for item in output.values()), output
          assert all(item['bytes'] > 0 for item in output.values()), output
          assert all(item['mp4_signature'] for item in output.values()), output
          PY
