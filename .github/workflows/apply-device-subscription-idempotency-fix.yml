name: Apply device subscription idempotency fix

on:
  push:
    branches:
      - agent/database-atomic-device-subscription

permissions:
  contents: write

concurrency:
  group: apply-device-subscription-idempotency-fix
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/database-atomic-device-subscription
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply focused codemod
        run: node scripts/apply-device-subscription-idempotency-fix.cjs

      - name: Validate repository
        run: |
          npm run verify
          git diff --check

      - name: Commit migration correction
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo 'Nenhuma alteração pendente.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/2026071303_atomic_device_subscription.sql
          git commit -m 'fix(database): preserve idempotency on subscription retries'
          git push origin HEAD:agent/database-atomic-device-subscription
