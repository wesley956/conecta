name: Build native Android debug APK

on:
  pull_request:
    branches:
      - main
    paths:
      - 'native-android/**'
      - 'scripts/check-native-only.mjs'
      - '.github/workflows/build-native-android-debug.yml'
      - '.github/workflows/release-native-android.yml'
  push:
    branches:
      - main
    paths:
      - 'native-android/**'
      - 'scripts/check-native-only.mjs'
      - '.github/workflows/build-native-android-debug.yml'
      - '.github/workflows/release-native-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile native Compose and Media3 app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Validate native-only platform
        run: node scripts/check-native-only.mjs

      - name: Compile debug APK
        working-directory: native-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: ronecaPlayerTV-native-debug
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
