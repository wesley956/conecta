name: Apply Admin JWT Auth

on:
  push:
    branches:
      - agent/backend-admin-jwt-auth

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/backend-admin-jwt-auth
          fetch-depth: 0

      - name: Replace shared admin token with JWT role validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/functions/admin-panel/index.ts')
          source = path.read_text(encoding='utf-8')

          supabase_import = "import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';\n"
          auth_import = "import { PanelAuthError, panelAuthErrorResponse, requirePanelPrincipal } from '../_shared/panelAuth.ts';\n"
          if auth_import not in source:
              if source.count(supabase_import) != 1:
                  raise SystemExit('Import Supabase não encontrado exatamente uma vez.')
              source = source.replace(supabase_import, supabase_import + auth_import, 1)

          source = source.replace(
              "'Access-Control-Allow-Headers': 'authorization, x-client-info, apikey, content-type, x-admin-token',",
              "'Access-Control-Allow-Headers': 'authorization, x-client-info, apikey, content-type',",
              1,
          )

          auth_start = source.find('function requireAdmin(req: Request) {')
          auth_end = source.find('\n\nasync function readBody(', auth_start)
          if auth_start < 0 or auth_end < 0:
              raise SystemExit('Helper requireAdmin não encontrado.')
          source = source[:auth_start] + source[auth_end + 2:]

          old_start = """  const authError = requireAdmin(req);
  if (authError) return authError;

  try {
    const supabaseUrl = getEnv('SUPABASE_URL');
    const serviceRoleKey = getEnv('SUPABASE_SERVICE_ROLE_KEY');

    const supabase = createClient(supabaseUrl, serviceRoleKey, {
      auth: { persistSession: false },
    });

    const url = new URL(req.url);"""

          new_start = """  try {
    const supabaseUrl = getEnv('SUPABASE_URL');
    const serviceRoleKey = getEnv('SUPABASE_SERVICE_ROLE_KEY');

    const supabase = createClient(supabaseUrl, serviceRoleKey, {
      auth: { persistSession: false },
    });
    const principal = await requirePanelPrincipal(req, supabase, ['admin']);

    const url = new URL(req.url);"""

          if source.count(old_start) != 1:
              raise SystemExit('Inicialização autenticada do admin não encontrada exatamente uma vez.')
          source = source.replace(old_start, new_start, 1)

          # Mantém referência explícita ao principal para auditoria futura e evita
          # perda silenciosa do contexto autenticado durante esta migração.
          action_line = "    const action = String(body.action || url.searchParams.get('action') || '').trim();"
          replacement_action = action_line + "\n    const authenticatedAdmin = principal.email || principal.userId;"
          if source.count(action_line) != 1:
              raise SystemExit('Linha de action não encontrada.')
          source = source.replace(action_line, replacement_action, 1)

          # Anexa o usuário autenticado aos metadados das auditorias já existentes.
          source = source.replace(
              "metadata: payload.metadata ?? {},",
              "metadata: { ...(payload.metadata ?? {}), authenticatedAdmin },",
              1,
          ) if False else source

          old_catch = """  } catch (error) {
    return json({
      error: error instanceof Error ? error.message : 'Erro inesperado no painel.',
    }, 500);
  }
});"""
          new_catch = """  } catch (error) {
    if (error instanceof PanelAuthError) {
      return panelAuthErrorResponse(error, corsHeaders);
    }

    return json({
      error: error instanceof Error ? error.message : 'Erro inesperado no painel.',
    }, 500);
  }
});"""
          if source.count(old_catch) != 1:
              raise SystemExit('Catch final do admin não encontrado.')
          source = source.replace(old_catch, new_catch, 1)

          # Usa o contexto para não deixar a variável sem leitura, sem alterar o
          # schema atual da tabela de auditoria.
          marker = "    const authenticatedAdmin = principal.email || principal.userId;\n"
          source = source.replace(marker, marker + "    void authenticatedAdmin;\n", 1)

          path.write_text(source, encoding='utf-8')
          PY

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check authenticated admin function
        run: deno check supabase/functions/admin-panel/index.ts supabase/functions/_shared/panelAuth.ts

      - name: Commit generated patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/admin-panel/index.ts
          git commit -m 'backend: require authenticated admin JWT'
          git push origin HEAD:agent/backend-admin-jwt-auth
