name: Apply Web Player stability patch on PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply embedded targeted patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/_apply_web_player_stability.yml').read_text()
          marker = "python - <<'PY'\n"
          if marker not in workflow:
              raise SystemExit('embedded patch marker missing')
          body = workflow.split(marker, 1)[1].split('\n          PY', 1)[0]
          exec(compile(textwrap.dedent(body), 'web-player-stability-patch', 'exec'))
          PY

      - name: Verify relay syntax and stability contract
        run: |
          node --check api/web-media-relay-v3.js
          node scripts/check-web-player-stability.mjs

      - name: Build Web Player
        run: |
          npm ci --prefix web-player --no-audit --no-fund
          npm run build --prefix web-player

      - name: Commit verified patch
        shell: bash
        run: |
          rm -f .github/web-player-stability-trigger.txt
          git rm .github/workflows/_apply_web_player_stability.yml
          git rm .github/workflows/_apply_web_player_stability_pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(web): stabilize catalog, relay and recovery"
          git push origin HEAD:${{ github.head_ref }}
