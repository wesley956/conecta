name: Build LG webOS installer

on:
  push:
    branches:
      - main
    paths:
      - 'smart-tv/**'
      - '.github/workflows/build-lg-webos-installer.yml'
  workflow_dispatch:
    inputs:
      hosted_url:
        description: Endereço HTTPS da versão hospedada para o IPK de teste
        required: false
        default: https://conecta-five-iota.vercel.app/tv/
      hosted_channel:
        description: Canal carregado pelo pacote hosted de teste
        required: false
        type: choice
        options:
          - test
          - stable
        default: test
  pull_request:
    branches:
      - main
    paths:
      - 'smart-tv/**'
      - '.github/workflows/build-lg-webos-installer.yml'

permissions:
  contents: write

concurrency:
  group: build-lg-webos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package-webos:
    name: Generate and validate LG IPK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RONECA_TV_HOSTED_URL: ${{ inputs.hosted_url || 'https://conecta-five-iota.vercel.app/tv/' }}
      RONECA_TV_HOSTED_CHANNEL: ${{ inputs.hosted_channel || 'test' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: smart-tv/package-lock.json

      - name: Install Smart TV dependencies
        working-directory: smart-tv
        run: npm ci

      - name: Typecheck
        working-directory: smart-tv
        run: npm run typecheck

      - name: Package webOS IPK
        working-directory: smart-tv
        run: npm run package:webos

      - name: Validate webOS package structure
        working-directory: smart-tv
        run: npm run validate:webos-package

      - name: Validate LG branding
        working-directory: smart-tv
        run: npm run validate:lg-branding

      - name: Validate LG navigation
        working-directory: smart-tv
        run: npm run validate:lg-navigation

      - name: Validate LG content
        working-directory: smart-tv
        run: npm run validate:lg-content

      - name: Validate LG VOD details
        working-directory: smart-tv
        run: npm run validate:lg-vod

      - name: Validate LG player
        working-directory: smart-tv
        run: npm run validate:lg-player

      - name: Validate LG resilience
        working-directory: smart-tv
        run: npm run validate:lg-resilience

      - name: Validate LG operations
        working-directory: smart-tv
        run: npm run validate:lg-operations

      - name: Validate LG performance
        id: lg_performance
        working-directory: smart-tv
        run: npm run validate:lg-performance 2>&1 | tee /tmp/lg-performance.log
        continue-on-error: true

      - name: Report LG performance failure on PR
        if: steps.lg_performance.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Saída de \`validate:lg-performance\` (diagnóstico automático)"
            echo '```'
            cat /tmp/lg-performance.log
            echo '```'
          } > /tmp/lg-performance-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/lg-performance-comment.md

      - name: Fail job if LG performance validator failed
        if: steps.lg_performance.outcome == 'failure'
        run: exit 1

      - name: Validate LG homologation
        working-directory: smart-tv
        run: npm run validate:lg-homologation

      - name: Check bundle budget
        working-directory: smart-tv
        run: npm run bundle:budget

      - name: Generate hosted webOS IPK for controlled testing
        working-directory: smart-tv
        run: npm run package:webos:hosted

      - name: Validate hosted artifact exists
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t hosted_packages < <(find smart-tv/artifacts/hosted -maxdepth 1 -type f -name 'com.ronecaplaytv.app*_all.ipk' -print)
          if [ "${#hosted_packages[@]}" -ne 1 ]; then
            echo "::error::Esperado exatamente um instalador IPK hosted; encontrados ${#hosted_packages[@]}."
            exit 1
          fi
          test -s "${hosted_packages[0]}"
          sha256sum "${hosted_packages[0]}" > smart-tv/artifacts/hosted/SHA256SUMS
          echo "Hosted de teste: $(basename "${hosted_packages[0]}")" >> "$GITHUB_STEP_SUMMARY"
          echo "Canal hosted: ${RONECA_TV_HOSTED_CHANNEL}" >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize verified packaged artifact
        shell: bash
        run: |
          set -euo pipefail
          jq -r '"IPK: \(.artifact)\nVersão: \(.version)\nSHA-256: \(.sha256)\nTamanho: \(.sizeBytes) bytes\nBaseline Android: \(.baselineAndroid)\nStatus técnico: \(.status)"' \
            smart-tv/artifacts/webos-release-metadata.json >> "$GITHUB_STEP_SUMMARY"
          echo "Seller Lounge icon: lg-seller-lounge-icon-400.png (400x400, derivado da marca oficial)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"LG-10: \(.state)\nAprovação física: \(.physicalApproval)\nParidade aprovada: \(.parityApproved)\nElegível a Stable: \(.stableEligible)\nArtefato exato obrigatório: \(.exactArtifactRequired)"' \
            smart-tv/artifacts/lg10-homologation-manifest.json >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Este workflow apenas constrói e valida o RC. Ele NÃO promove nem publica Stable." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified LG installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: roneca-play-tv-lg-ipk
          path: |
            smart-tv/artifacts/*.ipk
            smart-tv/artifacts/lg-seller-lounge-icon-400.png
            smart-tv/artifacts/SHA256SUMS
            smart-tv/artifacts/webos-release-metadata.json
            smart-tv/artifacts/lg10-homologation-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload LG hosted test artifact
        uses: actions/upload-artifact@v4
        with:
          name: roneca-play-tv-lg-hosted-ipk
          path: |
            smart-tv/artifacts/hosted/*.ipk
            smart-tv/artifacts/hosted/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      # LG-P07: promoção RC/Stable deve acontecer em um fluxo explícito separado,
      # somente depois dos gates físicos/homologação. Push/merge em main nunca
      # publica Stable automaticamente.

      # DIAGNÓSTICO TEMPORÁRIO (remover antes de mergear): o download de artifact
      # do Actions está bloqueado nesta sessão (blob.core.windows.net). Commitar os
      # binários direto na branch para recuperar via git normal.
      - name: TEMP - commit build artifacts to branch for retrieval
        if: github.ref == 'refs/heads/agent/lg-ipk-diagnostics'
        run: |
          set -euo pipefail
          mkdir -p _retrieve
          cp smart-tv/artifacts/*.ipk _retrieve/
          cp smart-tv/artifacts/lg-seller-lounge-icon-400.png _retrieve/
          cp smart-tv/artifacts/SHA256SUMS _retrieve/verified-SHA256SUMS
          cp smart-tv/artifacts/webos-release-metadata.json _retrieve/
          cp smart-tv/artifacts/lg10-homologation-manifest.json _retrieve/
          cp smart-tv/artifacts/hosted/*.ipk _retrieve/
          cp smart-tv/artifacts/hosted/SHA256SUMS _retrieve/hosted-SHA256SUMS
          git config user.name "roneca-ci-retrieve"
          git config user.email "ci-retrieve@users.noreply.github.com"
          git add -f _retrieve
          git commit -m "temp: artefatos do RC para recuperação (será removido)"
          git push origin HEAD:agent/lg-ipk-diagnostics
