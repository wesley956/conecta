name: Build LG webOS installer

on:
  push:
    branches:
      - main
    paths:
      - 'smart-tv/**'
      - '.github/workflows/build-lg-webos-installer.yml'
  workflow_dispatch:
    inputs:
      hosted_url:
        description: Endereço HTTPS da versão hospedada para o IPK de teste
        required: false
        default: https://conecta-five-iota.vercel.app/tv/
      hosted_channel:
        description: Canal carregado pelo pacote hosted de teste
        required: false
        type: choice
        options:
          - test
          - stable
        default: test
  pull_request:
    branches:
      - main
    paths:
      - 'smart-tv/**'
      - '.github/workflows/build-lg-webos-installer.yml'

permissions:
  contents: read

concurrency:
  group: build-lg-webos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package-webos:
    name: Generate and validate LG IPK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RONECA_TV_HOSTED_URL: ${{ inputs.hosted_url || 'https://conecta-five-iota.vercel.app/tv/' }}
      RONECA_TV_HOSTED_CHANNEL: ${{ inputs.hosted_channel || 'test' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: smart-tv/package-lock.json

      - name: Install Smart TV dependencies
        working-directory: smart-tv
        run: npm ci

      - name: Typecheck
        working-directory: smart-tv
        run: npm run typecheck

      - name: Generate and validate packaged webOS IPK
        working-directory: smart-tv
        run: npm run package:webos:verified

      - name: Check bundle budget
        working-directory: smart-tv
        run: npm run bundle:budget

      - name: Generate hosted webOS IPK for controlled testing
        working-directory: smart-tv
        run: npm run package:webos:hosted

      - name: Validate hosted artifact exists
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t hosted_packages < <(find smart-tv/artifacts/hosted -maxdepth 1 -type f -name 'com.ronecaplaytv.app*_all.ipk' -print)
          if [ "${#hosted_packages[@]}" -ne 1 ]; then
            echo "::error::Esperado exatamente um instalador IPK hosted; encontrados ${#hosted_packages[@]}."
            exit 1
          fi
          test -s "${hosted_packages[0]}"
          sha256sum "${hosted_packages[0]}" > smart-tv/artifacts/hosted/SHA256SUMS
          echo "Hosted de teste: $(basename "${hosted_packages[0]}")" >> "$GITHUB_STEP_SUMMARY"
          echo "Canal hosted: ${RONECA_TV_HOSTED_CHANNEL}" >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize verified packaged artifact
        shell: bash
        run: |
          set -euo pipefail
          jq -r '"IPK: \(.artifact)\nVersão: \(.version)\nSHA-256: \(.sha256)\nTamanho: \(.sizeBytes) bytes\nBaseline Android: \(.baselineAndroid)\nStatus: \(.status)"' \
            smart-tv/artifacts/webos-release-metadata.json >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Este workflow apenas constrói e valida. Ele NÃO promove nem publica Stable." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified LG installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: roneca-play-tv-lg-ipk
          path: |
            smart-tv/artifacts/*.ipk
            smart-tv/artifacts/SHA256SUMS
            smart-tv/artifacts/webos-release-metadata.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload LG hosted test artifact
        uses: actions/upload-artifact@v4
        with:
          name: roneca-play-tv-lg-hosted-ipk
          path: |
            smart-tv/artifacts/hosted/*.ipk
            smart-tv/artifacts/hosted/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      # LG-P07: promoção RC/Stable deve acontecer em um fluxo explícito separado,
      # somente depois dos gates físicos/homologação. Push/merge em main nunca
      # publica Stable automaticamente.
