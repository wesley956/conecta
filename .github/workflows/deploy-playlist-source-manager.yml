name: Deploy hardened playlist source manager

on:
  push:
    branches:
      - agent/universal-playlist-registration
    paths:
      - .deploy-playlist-source-manager

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/universal-playlist-registration
          fetch-depth: 0

      - name: Confirm deployment credential
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN não configurado"; exit 1; }

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy only playlist-source-manager
        shell: bash
        run: |
          supabase functions deploy playlist-source-manager \
            --project-ref awauvkjkucjqulkklmuo

      - name: Remove temporary deployment files
        shell: bash
        run: |
          rm -f .deploy-playlist-source-manager
          rm -f .github/workflows/deploy-playlist-source-manager.yml
          git config user.name "roneca-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "deploy: publicar cadastro universal endurecido"
          git push origin HEAD:agent/universal-playlist-registration
