name: Legacy playlist edit DB diagnostics

on:
  push:
    branches:
      - hotfix/legacy-playlist-edit-production
    paths:
      - 'supabase/migrations/2026072206_legacy_device_playlist_edit.sql'
      - 'supabase/tests/legacy_device_playlist_edit_test.sql'
      - '.github/workflows/legacy-playlist-edit-db-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      OPENAI_API_KEY: unused-in-ci

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --silent
      - name: Start local database
        run: npx supabase db start
      - name: Reapply migrations
        run: npx supabase db reset --local --no-seed
      - name: Run legacy playlist test
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx supabase test db --local supabase/tests/legacy_device_playlist_edit_test.sql 2>&1 | tee legacy-playlist-edit-tests.log
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-playlist-edit-tests
          path: legacy-playlist-edit-tests.log
          if-no-files-found: error
          retention-days: 7
      - name: Fail when test failed
        if: steps.tests.outcome != 'success'
        run: exit 1
      - name: Stop local database
        if: always()
        run: npx supabase stop --no-backup
