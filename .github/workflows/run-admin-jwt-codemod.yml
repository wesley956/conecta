name: Run Admin JWT Codemod

on:
  pull_request:
    branches:
      - agent/backend-shared-panel-auth

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/backend-admin-jwt-auth' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/backend-admin-jwt-auth
          fetch-depth: 0

      - name: Extract and execute authentication codemod
        shell: bash
        run: |
          awk '
            /python - <<'"'"'PY'"'"'/ { capture=1; next }
            capture && /^          PY$/ { capture=0; exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-admin-jwt-auth.yml > /tmp/codemod.py
          python /tmp/codemod.py

      - name: Apply already-audited customer relation dependency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/functions/admin-panel/index.ts')
          source = path.read_text(encoding='utf-8')

          if 'customerName: currentCustomer?.name || null,' not in source:
              marker = "      let creditConsumption = null;\n\n      if (isActivation || isRenewal) {"
              replacement = """      const currentCustomer = Array.isArray(currentDevice.customer)
        ? currentDevice.customer[0] ?? null
        : currentDevice.customer;

      let creditConsumption = null;

      if (isActivation || isRenewal) {"""

              if source.count(marker) != 1:
                  raise SystemExit('Marcador de currentCustomer não encontrado exatamente uma vez.')

              source = source.replace(marker, replacement, 1)

              old_access = 'customerName: currentDevice.customer?.name || null,'
              if source.count(old_access) != 1:
                  raise SystemExit('Acesso customer?.name não encontrado exatamente uma vez.')

              source = source.replace(
                  old_access,
                  'customerName: currentCustomer?.name || null,',
                  1,
              )

          path.write_text(source, encoding='utf-8')
          PY

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno check supabase/functions/admin-panel/index.ts supabase/functions/_shared/panelAuth.ts

      - name: Commit validated change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/admin-panel/index.ts
          git commit -m 'backend: require authenticated admin JWT'
          git push origin HEAD:agent/backend-admin-jwt-auth
