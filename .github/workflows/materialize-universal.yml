name: Materialize universal playlist registration

on:
  push:
    branches:
      - agent/universal-playlist-registration
    paths:
      - .universal-payload/READY

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/universal-playlist-registration
          fetch-depth: 0
      - name: Rebuild implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          expected = {
              '.universal-payload/part-002': '14719a0622de48bb5d69ef4651004a6bc0e47386',
              '.universal-payload/part-006': '26b0c07ca2fc40ce8fd456ab3fe37420b40f4eb3',
          }
          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='

          def blob_sha(value: str) -> str:
              raw = value.encode()
              return hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest()

          for filename, target in expected.items():
              path = Path(filename)
              current = path.read_text().strip()
              if blob_sha(current) == target:
                  continue
              found = None
              for position in range(len(current) + 1):
                  prefix = current[:position]
                  suffix = current[position:]
                  for character in alphabet:
                      candidate = prefix + character + suffix
                      if blob_sha(candidate) == target:
                          found = candidate
                          break
                  if found is not None:
                      break
              if found is None:
                  raise SystemExit(f'Não foi possível recuperar {filename}.')
              path.write_text(found)
              print(f'Recuperado {filename} com hash {target}.')
          PY
          {
            cat .universal-payload/part-000 .universal-payload/part-001 .universal-payload/part-002 .universal-payload/part-003 .universal-payload/part-004 .universal-payload/part-005 .universal-payload/part-006
            jq -r '.data' .universal-payload/final-segment.json
          } | tr -d '\r\n\t ' > /tmp/universal-payload.b64
          base64 --decode /tmp/universal-payload.b64 > /tmp/universal-payload.tar.gz
          echo "90696a261aef9b8ddda2f61634d398fcecd886e526240244f49ff6339b496259  /tmp/universal-payload.tar.gz" | sha256sum --check
          tar -xzf /tmp/universal-payload.tar.gz
          node scripts/apply-universal-registration.mjs
      - name: Verify implementation
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check:universal-playlist-source
          node --check admin-panel/universal-playlist-registration.js
      - name: Commit materialized files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .universal-payload
          rm -f .github/workflows/materialize-universal.yml
          git config user.name "roneca-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: implement universal playlist registration"
          git push origin HEAD:agent/universal-playlist-registration
