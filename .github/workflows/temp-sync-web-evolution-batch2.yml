name: Temporary Web Evolution Batch2 Base Sync

on:
  push:
    branches:
      - codex/web-evolution-batch-2

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout batch2 branch
        uses: actions/checkout@v4
        with:
          ref: codex/web-evolution-batch-2
          fetch-depth: 0

      - name: Merge latest batch1 base without losing batch2 integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin codex/web-evolution-batch-1
          git merge -X ours --no-edit origin/codex/web-evolution-batch-1
          rm .github/workflows/temp-sync-web-evolution-batch2.yml
          git add .github/workflows/temp-sync-web-evolution-batch2.yml
          git diff --cached --check
          git commit -m "chore(web): finish batch2 base synchronization"
          git push origin HEAD:codex/web-evolution-batch-2
