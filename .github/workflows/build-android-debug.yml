name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - redesign-streaming-v2
      - player-v2
      - stability-performance-audit
      - feature/player-cinematic-ui
      - fix/player-core-reliability

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Android SDK
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Apply validated reliability migration
        if: github.ref == 'refs/heads/fix/player-core-reliability'
        run: node scripts/run-player-core-reliability.cjs

      - name: Verify production env was loaded
        run: |
          test -f .env.production
          grep -q "VITE_ENABLE_DEVICE_PANEL=true" .env.production
          grep -q "VITE_DEVICE_CONFIG_URL=https://" .env.production

      - name: Verify web app
        run: npm run verify

      - name: Commit migrated player source
        if: github.ref == 'refs/heads/fix/player-core-reliability'
        shell: bash
        run: |
          if git diff --quiet -- src/screens/PlayerV2Screen.tsx; then
            echo "Player source already migrated."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/PlayerV2Screen.tsx
          git commit -m "fix: reforçar recuperação e sessões longas do player"
          git push origin HEAD:fix/player-core-reliability

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Prepare Roneca launcher icon
        run: node scripts/prepare-roneca-icon.cjs

      - name: Generate Android assets
        run: npx -y @capacitor/assets generate --android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Configure adaptive Android runtime
        run: node scripts/configure-android-adaptive.cjs

      - name: Configure Android SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RonecaPlayTV-player-reliability-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
