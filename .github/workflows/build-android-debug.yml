name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - redesign-streaming-v2
      - player-v2
      - stability-performance-audit
      - feature/player-cinematic-ui
    paths-ignore:
      - ".github/latest-android-build.txt"

permissions:
  contents: write

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Android SDK
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Verify production env was loaded
        run: |
          test -f .env.production
          grep -q "VITE_ENABLE_DEVICE_PANEL=true" .env.production
          grep -q "VITE_DEVICE_CONFIG_URL=https://" .env.production

      - name: Verify web app
        run: npm run verify

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Validate official launcher icon
        run: node scripts/validate-roneca-icon.cjs

      - name: Generate Android assets
        run: npx -y @capacitor/assets generate --android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Configure adaptive Android runtime
        run: node scripts/configure-android-adaptive.cjs

      - name: Configure Android SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RonecaPlayTV-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK in fixed test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_SOURCE="android/app/build/outputs/apk/debug/app-debug.apk"
          APK_NAME="RonecaPlayTV-debug.apk"
          RELEASE_TAG="ronecaplaytv-test-apk"

          cp "$APK_SOURCE" "$APK_NAME"

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "RonecaPlayTV APK de teste" \
              --notes "APK debug gerado automaticamente para testes em Android TV e TV Box." \
              --prerelease
          fi

          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes "APK debug atualizado automaticamente a partir do commit $GITHUB_SHA."

          gh release upload "$RELEASE_TAG" "$APK_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Record latest successful APK build
        run: |
          GENERATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > .github/latest-android-build.txt <<EOF
          status=success
          commit=$GITHUB_SHA
          generated_at=$GENERATED_AT
          release_tag=ronecaplaytv-test-apk
          apk_url=https://github.com/$GITHUB_REPOSITORY/releases/download/ronecaplaytv-test-apk/RonecaPlayTV-debug.apk
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/latest-android-build.txt
          git commit -m "ci: registrar APK de teste gerado [skip ci]"
          git push
