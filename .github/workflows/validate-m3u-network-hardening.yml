name: Validate M3U Network Hardening

on:
  pull_request:
    branches:
      - agent/runner-m3u-network-base

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'agent/network-cancel-m3u-downloads'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/network-cancel-m3u-downloads
          fetch-depth: 0

      - name: Apply network hardening
        run: python scripts/apply-fetch-m3u-network-hardening.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:m3u-parser

      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/utils/fetchM3U.ts
          git commit -m 'network: cancel and bound M3U downloads'
          git push origin HEAD:agent/network-cancel-m3u-downloads
