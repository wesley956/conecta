name: Apply secure playlist editing API

on:
  push:
    branches:
      - feature/edit-subscription-playlists
    paths:
      - '.github/workflows/apply-playlist-edit-api.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/edit-subscription-playlists
          fetch-depth: 0

      - name: Add playlist edit flow to subscription API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('supabase/functions/subscription-panel/index.ts')
          text = path.read_text()

          safe_host = '''function safeHost(value: unknown) {
  const text = String(value ?? '').trim();
  if (!text) return null;
  try {
    const url = new URL(text);
    return url.port ? `${url.hostname}:${url.port}` : url.hostname;
  } catch {
    return null;
  }
}
'''

          helpers = safe_host + '''
function normalizePlaylistType(value: unknown) {
  const type = String(value ?? 'm3u').trim().toLowerCase();
  if (!['m3u', 'xtream', 'stalker'].includes(type)) {
    throw new Error('Tipo de lista inválido.');
  }
  return type;
}

function validatePlaylistUrl(value: unknown) {
  const raw = requiredText(value, 'Nova URL da lista', 4096);
  let parsed: URL;
  try {
    parsed = new URL(raw);
  } catch {
    throw new Error('Nova URL da lista é inválida.');
  }
  if (!['http:', 'https:'].includes(parsed.protocol)) {
    throw new Error('A URL da lista precisa usar HTTP ou HTTPS.');
  }
  if (parsed.username || parsed.password) {
    throw new Error('Não informe credenciais antes do domínio. Use os parâmetros fornecidos pelo provedor.');
  }
  parsed.hash = '';
  return parsed.toString();
}

function maskedPlaylistPreview(value: unknown) {
  const raw = String(value ?? '').trim();
  if (!raw) return null;
  try {
    const parsed = new URL(raw);
    const segments = parsed.pathname.split('/').map((segment, index, all) => {
      const previous = String(all[index - 1] || '').toLowerCase();
      if (['live', 'movie', 'series'].includes(previous)) return '••••';
      if (index > 1 && ['live', 'movie', 'series'].includes(String(all[index - 2] || '').toLowerCase())) return '••••';
      if (segment.length > 28) return `${segment.slice(0, 5)}…${segment.slice(-3)}`;
      return segment;
    });
    const keys = [...new Set([...parsed.searchParams.keys()])];
    const query = keys.length
      ? `?${keys.map(key => `${encodeURIComponent(key)}=••••`).join('&')}`
      : '';
    return `${parsed.protocol}//${parsed.host}${segments.join('/')}${query}`;
  } catch {
    return null;
  }
}

function normalizedPlaylistSource(value: string) {
  const parsed = new URL(value);
  parsed.hash = '';
  parsed.hostname = parsed.hostname.toLowerCase();
  const entries = [...parsed.searchParams.entries()]
    .sort(([leftKey, leftValue], [rightKey, rightValue]) => {
      const keyOrder = leftKey.localeCompare(rightKey);
      return keyOrder || leftValue.localeCompare(rightValue);
    });
  parsed.search = '';
  for (const [key, entryValue] of entries) parsed.searchParams.append(key, entryValue);
  return parsed.toString();
}

async function hmacSha256Hex(secret: string, value: string) {
  const encoder = new TextEncoder();
  const key = await crypto.subtle.importKey(
    'raw',
    encoder.encode(secret),
    { name: 'HMAC', hash: 'SHA-256' },
    false,
    ['sign'],
  );
  const signature = await crypto.subtle.sign('HMAC', key, encoder.encode(value));
  return [...new Uint8Array(signature)]
    .map(byte => byte.toString(16).padStart(2, '0'))
    .join('');
}

async function triggerPlaylistCache(supabaseUrl: string, playlistId: string) {
  const adminToken = getEnv('ADMIN_PANEL_TOKEN');
  const response = await fetch(`${supabaseUrl}/functions/v1/playlist-cache`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-admin-token': adminToken,
    },
    body: JSON.stringify({ action: 'refresh', playlistId }),
  });
  const data = await response.json().catch(() => ({}));
  return {
    ok: response.ok && data?.ok === true,
    status: response.status,
    data,
    error: data?.error || data?.message || (!response.ok ? `Falha HTTP ${response.status}.` : null),
  };
}

async function archiveCandidatePlaylist(supabase: any, playlistId: string, errorMessage: string | null = null) {
  const now = new Date().toISOString();
  await supabase
    .from('panel_playlists')
    .update({
      active: false,
      archived_at: now,
      playlist_cache_status: errorMessage ? 'error' : 'archived',
      playlist_cache_error: errorMessage ? errorMessage.slice(0, 500) : null,
    })
    .eq('id', playlistId);
  await supabase
    .from('panel_seller_playlists')
    .update({ active: false, updated_at: now })
    .eq('playlist_id', playlistId);
}
'''

          if 'function normalizePlaylistType' not in text:
            if safe_host not in text:
              raise SystemExit('safeHost marker not found')
            text = text.replace(safe_host, helpers, 1)

          text = text.replace(
            "        playlist_type,\n        active,",
            "        playlist_type,\n        playlist_updated_at,\n        active,",
            1,
          )

          mapping_marker = '''      type: playlist.playlist_type,
      active: playlist.active === true,'''
          mapping_replacement = '''      type: playlist.playlist_type,
      sourcePreview: maskedPlaylistPreview(playlist.playlist_url),
      sourceUpdatedAt: playlist.playlist_updated_at || null,
      active: playlist.active === true,'''
          if mapping_replacement not in text:
            if mapping_marker not in text:
              raise SystemExit('playlist mapping marker not found')
            text = text.replace(mapping_marker, mapping_replacement, 1)

          text = text.replace(
            "    'Chave de idempotência',\n",
            "    'Chave de idempotência',\n    'nova lista',\n    'Nova lista',\n    'cache válido',\n    'editar listas',\n",
            1,
          )

          assert_marker = '''async function assertSubscriptionAccess(supabase: any, principal: PanelPrincipal, subscriptionId: string) {'''
          edit_function = '''async function editSubscriptionPlaylist(supabase: any, principal: PanelPrincipal, body: JsonBody) {
  const subscriptionId = requiredUuid(body.subscriptionId, 'Assinatura');
  const priority = integerInRange(body.priority, 'Posição da lista', 1, 2);
  const access = await assertSubscriptionAccess(supabase, principal, subscriptionId);
  const name = requiredText(body.name, 'Nome da lista', 180);
  const playlistUrl = validatePlaylistUrl(body.playlistUrl);
  const playlistType = normalizePlaylistType(body.playlistType);
  const maxConnections = integerInRange(body.maxConnections, 'Conexões suportadas', 1, 50);
  const reason = requiredText(body.reason, 'Motivo da edição', 500);
  const idempotencyKey = operationKey(body.idempotencyKey, 'subscription-replace-playlist');

  const { data: subscription, error: subscriptionError } = await supabase
    .from('panel_subscriptions')
    .select('id, seller_id, status, simultaneous_connections_snapshot')
    .eq('id', subscriptionId)
    .maybeSingle();
  if (subscriptionError || !subscription) throw new Error('Assinatura não encontrada.');
  if (subscription.seller_id !== access.seller_id) throw new Error('Carteira da assinatura é inválida.');
  if (['cancelled', 'needs_review'].includes(subscription.status)) {
    throw new Error('A assinatura não permite editar listas neste estado.');
  }
  if (maxConnections < Number(subscription.simultaneous_connections_snapshot || 1)) {
    throw new Error('A nova lista não suporta as conexões simultâneas do plano.');
  }

  const serviceRoleKey = getEnv('SUPABASE_SERVICE_ROLE_KEY');
  const supabaseUrl = getEnv('SUPABASE_URL');
  const fingerprint = await hmacSha256Hex(serviceRoleKey, normalizedPlaylistSource(playlistUrl));
  const now = new Date().toISOString();

  const { data: candidate, error: candidateError } = await supabase
    .from('panel_playlists')
    .insert({
      name,
      playlist_url: playlistUrl,
      playlist_type: playlistType,
      active: true,
      max_connections: maxConnections,
      source_fingerprint: fingerprint,
      playlist_updated_at: now,
      playlist_cache_status: 'processing',
      playlist_cache_error: null,
    })
    .select('id, name, playlist_type, max_connections')
    .single();

  if (candidateError || !candidate?.id) {
    const duplicate = candidateError?.code === '23505';
    throw new Error(duplicate
      ? 'Esta origem já está cadastrada e não pode ser duplicada.'
      : 'Não foi possível preparar a nova lista.');
  }

  const candidateId = String(candidate.id);
  try {
    const { error: permissionError } = await supabase
      .from('panel_seller_playlists')
      .upsert({
        seller_id: subscription.seller_id,
        playlist_id: candidateId,
        active: true,
        updated_at: now,
      }, { onConflict: 'seller_id,playlist_id' });
    if (permissionError) throw new Error('Não foi possível liberar a nova lista ao vendedor.');

    const cache = await triggerPlaylistCache(supabaseUrl, candidateId);
    if (!cache.ok) {
      const detail = String(cache.error || 'A origem não gerou um cache válido.').slice(0, 260);
      await archiveCandidatePlaylist(supabase, candidateId, detail);
      throw new Error(`A nova lista não foi aplicada. A lista anterior continua funcionando. Motivo: ${detail}`);
    }

    const { data: switched, error: switchError } = await supabase.rpc(
      'replace_subscription_playlist_transaction',
      {
        p_subscription_id: subscriptionId,
        p_priority: priority,
        p_candidate_playlist_id: candidateId,
        p_reason: reason,
        p_performed_by: principal.email || principal.userId,
        p_performed_by_user_id: principal.userId,
        p_idempotency_key: idempotencyKey,
      },
    );
    if (switchError) {
      await archiveCandidatePlaylist(supabase, candidateId, switchError.message || 'Falha ao concluir a troca.');
      throw new Error(cleanDatabaseError(switchError, 'A nova lista foi validada, mas não pôde ser vinculada.'));
    }

    const result = Array.isArray(switched) ? switched[0] : switched;
    return {
      ...result,
      playlist: {
        id: candidateId,
        name,
        type: playlistType,
        sourcePreview: maskedPlaylistPreview(playlistUrl),
        maxConnections,
        cacheStatus: 'ready',
        cacheItemCount: Number(cache.data?.itemCount || 0),
      },
      message: priority === 1
        ? 'Lista principal validada e atualizada em todos os aparelhos.'
        : 'Lista reserva validada e atualizada em todos os aparelhos.',
    };
  } catch (error) {
    const { data: activeAssignment } = await supabase
      .from('panel_subscription_playlists')
      .select('id')
      .eq('playlist_id', candidateId)
      .eq('active', true)
      .maybeSingle();
    if (!activeAssignment) {
      await archiveCandidatePlaylist(
        supabase,
        candidateId,
        error instanceof Error ? error.message : 'Falha ao aplicar a nova lista.',
      );
    }
    throw error;
  }
}

'''
          if 'async function editSubscriptionPlaylist' not in text:
            if assert_marker not in text:
              raise SystemExit('assertSubscriptionAccess marker not found')
            text = text.replace(assert_marker, edit_function + assert_marker, 1)

          switch_marker = '''      case 'renew':
        result = await renew(supabase, principal, body);
        break;'''
          switch_replacement = switch_marker + '''
      case 'editPlaylist':
        result = await editSubscriptionPlaylist(supabase, principal, body);
        break;'''
          if "case 'editPlaylist'" not in text:
            if switch_marker not in text:
              raise SystemExit('switch marker not found')
            text = text.replace(switch_marker, switch_replacement, 1)

          path.write_text(text)
          PY

          deno fmt supabase/functions/subscription-panel/index.ts
          grep -q "case 'editPlaylist'" supabase/functions/subscription-panel/index.ts
          grep -q 'replace_subscription_playlist_transaction' supabase/functions/subscription-panel/index.ts
          grep -q 'sourcePreview' supabase/functions/subscription-panel/index.ts

      - name: Remove temporary workflow and push
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-playlist-edit-api.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/subscription-panel/index.ts
          git commit -m 'Adicionar edição validada de listas no painel de assinaturas'
          git push origin HEAD:feature/edit-subscription-playlists
