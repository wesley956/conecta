name: Apply universal endpoint failover

on:
  push:
    branches:
      - agent/universal-endpoint-device-failover
    paths:
      - .github/workflows/apply-universal-endpoint-failover.yml

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/universal-endpoint-device-failover
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply patch
        run: python3 scripts/apply-universal-endpoint-failover.py
      - name: Validate parser and contracts
        run: node --experimental-strip-types scripts/check-universal-playlist-source.mjs
      - name: Check Edge Function
        run: deno check supabase/functions/device-config-qualified/index.ts
      - name: Build Android tests
        working-directory: native-android
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Commit verified fix
        run: |
          git config user.name roneca-automation
          git config user.email actions@users.noreply.github.com
          git add supabase/functions/device-config-qualified/index.ts native-android/app/src/main/java/com/ronecaplaytv/nativeapp/activation/DeviceSessionState.kt native-android/app/src/main/java/com/ronecaplaytv/nativeapp/network/DeviceApi.kt native-android/app/src/main/java/com/ronecaplaytv/nativeapp/catalog/CatalogViewModel.kt scripts/check-universal-playlist-source.mjs
          git commit -m "fix: testar todos os endpoints da mesma lista"
          git push origin HEAD:agent/universal-endpoint-device-failover
