name: Apply Secure Cache Wait State

on:
  push:
    branches:
      - agent/fix-secure-cache-wait-state

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-secure-cache-wait-state
          fetch-depth: 0

      - name: Apply secure cache message
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          source = path.read_text(encoding='utf-8')
          start_marker = '        if (!playlistUrl) {'
          end_marker = "\n\n        setActiveNotice(\n          cacheErrorMessage"

          start = source.find(start_marker)
          if start < 0:
              raise SystemExit('Início do bloco sem playlistUrl não encontrado.')

          end = source.find(end_marker, start)
          if end < 0:
              raise SystemExit('Fim do bloco sem playlistUrl não encontrado.')

          new_block = "\n".join([
              "        if (!playlistUrl) {",
              "          const secureCacheMessage = config.message || (",
              "            cacheStatus === 'building' || cacheStatus === 'processing'",
              "              ? 'Aparelho ativo. O catálogo seguro ainda está sendo preparado no painel.'",
              "              : cacheStatus === 'error'",
              "                ? `Aparelho ativo, mas o cache seguro falhou. ${config.cacheError || ''}`.trim()",
              "                : 'Aparelho ativo, mas nenhuma lista segura está disponível no momento.'",
              "          );",
              "",
              "          setActiveNotice(",
              "            cacheErrorMessage",
              "              ? `Atenção: cache do painel falhou e o fallback direto está desabilitado. ${cacheErrorMessage}`",
              "              : secureCacheMessage",
              "          );",
              "          return;",
              "        }",
          ])

          path.write_text(source[:start] + new_block + source[end:], encoding='utf-8')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck

      - name: Commit generated patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git commit -m 'fix: show secure cache preparation state'
          git push origin HEAD:agent/fix-secure-cache-wait-state
