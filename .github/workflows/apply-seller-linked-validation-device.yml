name: Apply seller-linked validation device fix

on:
  push:
    branches:
      - agent/fix-seller-linked-validation-device
    paths:
      - .seller-linked-validation-trigger

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-seller-linked-validation-device
          fetch-depth: 0

      - name: Apply guarded patch
        run: python scripts/patch-seller-linked-validation-device.py

      - name: Check panel JavaScript
        run: node --check admin-panel/playlist-commercial-qualification.js

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check playlist validation function
        run: deno check supabase/functions/playlist-validation/index.ts

      - name: Commit verified fix
        run: |
          rm -f scripts/patch-seller-linked-validation-device.py
          rm -f .github/workflows/apply-seller-linked-validation-device.yml
          rm -f .seller-linked-validation-trigger
          git config user.name "roneca-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: allow seller-linked device validation"
          git push origin HEAD:agent/fix-seller-linked-validation-device
