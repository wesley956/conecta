name: Run Secure Cache Wait State

on:
  pull_request:
    branches:
      - agent/security-client-device-credential

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/fix-secure-cache-wait-state' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-secure-cache-wait-state
          fetch-depth: 0

      - name: Extract and execute codemod
        shell: bash
        run: |
          awk '
            /python - <<'"'"'PY'"'"'/ { capture=1; next }
            capture && /^          PY$/ { capture=0; exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-secure-cache-wait-state.yml > /tmp/codemod.py
          python /tmp/codemod.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck

      - name: Commit validated change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git commit -m 'fix: show secure cache preparation state'
          git push origin HEAD:agent/fix-secure-cache-wait-state
