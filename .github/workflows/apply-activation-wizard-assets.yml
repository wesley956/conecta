name: Apply activation wizard assets
on:
  push:
    branches:
      - agent/activation-wizard-provisional
    paths:
      - .github/workflows/apply-activation-wizard-assets.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/activation-wizard-provisional
      - name: Patch seller portal and checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path('admin-panel/seller.html')
          text = page.read_text()
          css = '  <link rel="stylesheet" href="./seller-activation-wizard.css" />\n'
          js = '  <script src="./seller-activation-wizard.js"></script>\n'
          if 'seller-activation-wizard.css' not in text:
              text = text.replace('  <link rel="stylesheet" href="./app-release.css" />\n', '  <link rel="stylesheet" href="./app-release.css" />\n' + css)
          if 'seller-activation-wizard.js' not in text:
              text = text.replace('  <script src="./app-release.js"></script>\n', '  <script src="./app-release.js"></script>\n' + js)
          page.write_text(text)

          check = Path('scripts/check-activation-wizard.mjs')
          check.write_text("""import fs from 'node:fs';\nimport assert from 'node:assert/strict';\nconst page=fs.readFileSync('admin-panel/seller.html','utf8');\nconst ui=fs.readFileSync('admin-panel/seller-activation-wizard.js','utf8');\nconst edge=fs.readFileSync('supabase/functions/seller-device-flow/index.ts','utf8');\nconst migration=fs.readFileSync('supabase/migrations/20260806050000_provisional_activation_and_playlist_change.sql','utf8');\nassert.ok(page.includes('seller-activation-wizard.css'));\nassert.ok(page.includes('seller-activation-wizard.js'));\nfor(const item of ['Cliente','Plano','Lista','Reserva','Confirmar','changePlaylists','RonecaUniversalPlaylists.open']) assert.ok(ui.includes(item), item);\nassert.ok(ui.includes('__ronecaPlaylistFlowController'));\nassert.ok(edge.includes("action === 'activate'"));\nassert.ok(edge.includes("action === 'changePlaylists'"));\nassert.ok(edge.includes('apply_device_subscription_transaction'));\nassert.ok(edge.includes('change_device_playlists_transaction'));\nassert.ok(migration.includes("'validating','awaiting_device_test','retryable_error'"));\nassert.ok(migration.includes('device.playlists_changed_without_renewal'));\nconsole.log('Activation wizard contracts validated.');\n""")
          PY
          rm .github/workflows/apply-activation-wizard-assets.yml
          node --check admin-panel/seller-activation-wizard.js
          node scripts/check-activation-wizard.mjs
      - name: Commit generated patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add admin-panel/seller.html scripts/check-activation-wizard.mjs .github/workflows/apply-activation-wizard-assets.yml
          git commit -m "feat: connect activation wizard to seller portal"
          git push origin HEAD:agent/activation-wizard-provisional
