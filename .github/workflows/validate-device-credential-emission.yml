name: Validate Device Credential Emission

on:
  push:
    branches:
      - agent/security-issue-device-credential

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-issue-device-credential
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check activation function
        run: deno check supabase/functions/device-activate/index.ts

      - name: Record successful validation
        shell: bash
        run: |
          mkdir -p .validation
          printf 'deno check passed for device-activate at %s\n' "$(date -u +%FT%TZ)" > .validation/device-credential-emission.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .validation/device-credential-emission.txt
          git commit -m 'test: validate device credential emission'
          git push origin HEAD:agent/security-issue-device-credential
