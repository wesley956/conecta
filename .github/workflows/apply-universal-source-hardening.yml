name: Apply universal source hardening

on:
  push:
    branches:
      - agent/universal-playlist-registration

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/universal-playlist-registration
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply source isolation guards
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          manager = Path('supabase/functions/playlist-source-manager/index.ts')
          s = manager.read_text()
          old = """  const security = securityPayload(body, parsed);
            const connectionProfile = connectionProfilePayload(body, security);
            const existingPlaylistId = uuid(body.playlistId, 'Lista', true);
            if (existingPlaylistId) await assertPlaylistAccess(supabase, principal, existingPlaylistId);
          """
          new = """  const existingPlaylistId = uuid(body.playlistId, 'Lista', true);
            if (existingPlaylistId && principal.role === 'seller') {
              throw new PanelAuthError(
                'A edição da origem e da segurança é restrita ao administrador.',
                403,
              );
            }
            if (existingPlaylistId) await assertPlaylistAccess(supabase, principal, existingPlaylistId);
            const security = securityPayload(body, parsed);
            if (principal.role === 'seller' && security.mode !== 'strict') {
              throw new PanelAuthError(
                'Somente administradores podem configurar exceções de certificado.',
                403,
              );
            }
            const connectionProfile = connectionProfilePayload(body, security);
          """
          assert old in s
          s = s.replace(old, new, 1)

          old = """  const playlistId = String(result.playlist_id);

            if (security.mode === 'strict' && security.scopes.cache) {
          """
          new = """  const playlistId = String(result.playlist_id);
            const created = result.created === true;
            const editing = Boolean(existingPlaylistId);

            // O cadastro canônico pode reutilizar uma origem já compartilhada. Nessa
            // situação, vincular a lista é permitido, mas a solicitação atual jamais
            // pode sobrescrever endpoints, cabeçalhos ou a política TLS existente.
            if (!created && !editing) {
              return {
                playlistId,
                created: false,
                reused: true,
                endpointCount: Number(result.endpoint_count || 0),
                source: parsed.redactedSummary,
                security: null,
                message: 'Esta origem já existia e foi apenas reutilizada, sem alterar configuração, segurança ou endpoints.',
              };
            }

            if (security.mode === 'strict' && security.scopes.cache) {
          """
          assert old in s
          s = s.replace(old, new, 1)
          s = s.replace("""    created: result.created === true,
          """, """    created,
              reused: false,
          """, 1)
          s = s.replace("""    message: result.created === true
                ? 'Fonte salva com todos os endpoints. A validação foi iniciada.'
                : 'Fonte existente atualizada sem criar duplicação.',
          """, """    message: created
                ? 'Fonte salva com todos os endpoints. A validação foi iniciada.'
                : 'Fonte existente atualizada pelo administrador sem criar duplicação.',
          """, 1)

          old = """    security = securityPayload(body, parsed);
              profile = connectionProfilePayload(body, security);
              if (playlistId) await assertPlaylistAccess(supabase, principal, playlistId);
          """
          new = """    if (playlistId && principal.role === 'seller') {
                throw new PanelAuthError(
                  'A edição e o teste de uma configuração alterada são restritos ao administrador.',
                  403,
                );
              }
              security = securityPayload(body, parsed);
              if (principal.role === 'seller' && security.mode !== 'strict') {
                throw new PanelAuthError(
                  'Somente administradores podem testar exceções de certificado.',
                  403,
                );
              }
              profile = connectionProfilePayload(body, security);
              if (playlistId) await assertPlaylistAccess(supabase, principal, playlistId);
          """
          assert old in s
          s = s.replace(old, new, 1)

          old = """    if (action === 'details') {
                const playlistId = uuid(body.playlistId, 'Lista')!;
                return json(request, { ok: true, ...(await details(supabase, principal, playlistId)) });
              }
          """
          new = """    if (action === 'details') {
                if (principal.role === 'seller') {
                  throw new PanelAuthError('Os detalhes sensíveis da origem são restritos ao administrador.', 403);
                }
                const playlistId = uuid(body.playlistId, 'Lista')!;
                return json(request, { ok: true, ...(await details(supabase, principal, playlistId)) });
              }
          """
          assert old in s
          s = s.replace(old, new, 1)
          manager.write_text(s)

          migration = Path('supabase/migrations/20260805210500_universal_playlist_sources.sql')
          s = migration.read_text()
          old = """  if v_role not in ('owner', 'admin', 'seller', 'system') then
              raise exception using errcode = '22023', message = 'Responsável inválido.';
            end if;
            if v_tls_mode = 'insecure' and coalesce((p_security ->> 'riskAccepted')::boolean, false) is not true then
          """
          new = """  if v_role not in ('owner', 'admin', 'seller', 'system') then
              raise exception using errcode = '22023', message = 'Responsável inválido.';
            end if;
            if v_role = 'seller' and p_existing_playlist_id is not null then
              raise exception using errcode = '42501', message = 'Vendedor não pode editar uma origem compartilhada.';
            end if;
            if v_role = 'seller' and v_tls_mode <> 'strict' then
              raise exception using errcode = '42501', message = 'Vendedor não pode configurar exceção de certificado.';
            end if;
            if v_tls_mode = 'insecure' and coalesce((p_security ->> 'riskAccepted')::boolean, false) is not true then
          """
          assert old in s
          s = s.replace(old, new, 1)

          old = """    v_playlist_id := v_registration.playlist_id;
              v_created := v_registration.created;
            end if;

            update public.panel_playlists playlist
          """
          new = """    v_playlist_id := v_registration.playlist_id;
              v_created := v_registration.created;
            end if;

            -- Reutilização canônica é somente vínculo. Nunca sobrescreve uma origem
            -- compartilhada com dados, endpoints ou segurança enviados por outro ator.
            if p_existing_playlist_id is null and v_created is false then
              select count(*)::integer
              into v_endpoint_count
              from public.panel_playlist_endpoints endpoint
              where endpoint.playlist_id = v_playlist_id
                and endpoint.active is true;

              insert into public.panel_audit_logs (
                action, entity_type, entity_id, description, metadata, performed_by
              ) values (
                'universal_playlist_reused',
                'playlist',
                v_playlist_id,
                'Origem existente reutilizada sem alterar configuração, endpoints ou política TLS.',
                jsonb_build_object('role', v_role, 'endpointCount', v_endpoint_count),
                v_role || ':' || coalesce(p_created_by_user_id::text, 'system')
              );

              return query select v_playlist_id, false, v_endpoint_count;
              return;
            end if;

            update public.panel_playlists playlist
          """
          assert old in s
          s = s.replace(old, new, 1)
          migration.write_text(s)

          start = s.index('create or replace function public.register_universal_playlist_source_transaction(')
          func_end = s.index('$$;', start) + 3
          revoke_start = s.index('revoke all on function public.register_universal_playlist_source_transaction(', func_end)
          perm_end = s.index('comment on table public.panel_playlist_endpoints', revoke_start)
          comment_start = s.index('comment on function public.register_universal_playlist_source_transaction(', perm_end)
          end_marker = ") is 'Cadastro atômico e canônico de uma fonte com vários endpoints e TLS por lista.';"
          comment_end = s.index(end_marker, comment_start) + len(end_marker)
          guard = (
              '-- Protege fontes universais compartilhadas contra sobrescrita por reutilização canônica.\n'
              '-- Migração incremental porque a fundação universal já foi aplicada em produção.\n\n'
              + s[start:func_end] + '\n\n'
              + s[revoke_start:perm_end].rstrip() + '\n\n'
              + s[comment_start:comment_end] + '\n'
          )
          Path('supabase/migrations/20260806012800_universal_playlist_shared_source_guard.sql').write_text(guard)

          ui = Path('admin-panel/universal-playlist-registration.js')
          s = ui.read_text()
          s = s.replace(
              '''            <label class="upl-check"><input type="radio" name="uplTlsMode" value="custom_ca"><span><strong>Confiar em certificado específico</strong><br><small>Adiciona a autoridade PEM informada somente nesta fonte.</small></span></label>
              <label class="upl-check"><input type="radio" name="uplTlsMode" value="insecure"><span><strong>Ignorar erros do certificado</strong><br><small>Modo de compatibilidade limitado aos domínios autorizados.</small></span></label>
          ''',
              '''            <label class="upl-check" data-upl-admin-security><input type="radio" name="uplTlsMode" value="custom_ca"><span><strong>Confiar em certificado específico</strong><br><small>Adiciona a autoridade PEM informada somente nesta fonte.</small></span></label>
              <label class="upl-check" data-upl-admin-security><input type="radio" name="uplTlsMode" value="insecure"><span><strong>Ignorar erros do certificado</strong><br><small>Modo de compatibilidade limitado aos domínios autorizados.</small></span></label>
          ''', 1)
          old = '''    document.body.appendChild(modal);

              document.querySelectorAll('input[name="uplMode"]').forEach(function (input) { input.addEventListener('change', syncMode); });
          '''
          new = '''    document.body.appendChild(modal);

              if (state.surface === 'seller') {
                modal.querySelectorAll('[data-upl-admin-security]').forEach(function (item) { item.remove(); });
                var strictOnlyNote = document.createElement('div');
                strictOnlyNote.className = 'upl-panel ok';
                strictOnlyNote.textContent = 'Contas de vendedor usam validação segura de certificado. Exceções TLS são configuradas somente pelo administrador.';
                var securityPanel = modal.querySelector('[data-upl-pane="2"] .upl-panel');
                if (securityPanel) securityPanel.insertAdjacentElement('afterend', strictOnlyNote);
              }

              document.querySelectorAll('input[name="uplMode"]').forEach(function (input) { input.addEventListener('change', syncMode); });
          '''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''        <div class="upl-actions"><button class="upl-btn" type="button" onclick="RonecaUniversalPlaylists.edit('${esc(source.id)}')">Editar</button><button class="upl-btn" type="button" onclick="RonecaUniversalPlaylists.testSaved('${esc(source.id)}')">Testar</button><button class="upl-btn danger" type="button" onclick="RonecaUniversalPlaylists.remove('${esc(source.id)}')">Excluir</button></div>
          '''
          new = '''        <div class="upl-actions">${state.surface === 'admin' ? `<button class="upl-btn" type="button" onclick="RonecaUniversalPlaylists.edit('${esc(source.id)}')">Editar</button>` : ''}<button class="upl-btn" type="button" onclick="RonecaUniversalPlaylists.testSaved('${esc(source.id)}')">Testar</button><button class="upl-btn danger" type="button" onclick="RonecaUniversalPlaylists.remove('${esc(source.id)}')">Excluir</button></div>
          '''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''  function securityPayload() {
              var selected = document.querySelector('input[name="uplTlsMode"]:checked'); var mode = selected ? selected.value : 'strict';
              return { mode: mode, allowedHosts: value('uplAllowedHosts').split(/\\n+/).map(function (item) { return item.trim(); }).filter(Boolean), allowSubdomains: checked('uplAllowSubdomains'), allowRedirectHosts: checked('uplAllowRedirectHosts'), riskAccepted: checked('uplRiskAccepted'), scopes: { validation: checked('uplScopeValidation', true), cache: checked('uplScopeCache', true), catalog: checked('uplScopeCatalog', true), playback: checked('uplScopePlayback', true) } };
            }
          '''
          new = '''  function securityPayload() {
              var selected = document.querySelector('input[name="uplTlsMode"]:checked');
              var mode = state.surface === 'seller' ? 'strict' : (selected ? selected.value : 'strict');
              return { mode: mode, allowedHosts: value('uplAllowedHosts').split(/\\n+/).map(function (item) { return item.trim(); }).filter(Boolean), allowSubdomains: state.surface === 'seller' ? false : checked('uplAllowSubdomains'), allowRedirectHosts: state.surface === 'seller' ? false : checked('uplAllowRedirectHosts'), riskAccepted: state.surface === 'seller' ? false : checked('uplRiskAccepted'), scopes: { validation: checked('uplScopeValidation', true), cache: checked('uplScopeCache', true), catalog: checked('uplScopeCatalog', true), playback: checked('uplScopePlayback', true) } };
            }
          '''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''  async function edit(playlistId) {
              ensureModal(); reset();
          '''
          new = '''  async function edit(playlistId) {
              if (state.surface === 'seller') {
                global.alert('A edição da origem e da segurança é restrita ao administrador.');
                return;
              }
              ensureModal(); reset();
          '''
          assert old in s
          s = s.replace(old, new, 1)
          ui.write_text(s)

          auth = Path('admin-panel/panel-auth-session.js')
          s = auth.read_text()
          old = """    'subscription-panel': true,
              'app-release': true,
          """
          new = """    'subscription-panel': true,
              'playlist-source-manager': true,
              'app-release': true,
          """
          assert old in s
          s = s.replace(old, new, 1)
          old = r"/^\/functions\/v1\/(admin-panel|seller-panel|subscription-panel|app-release)(?:\/|$)/"
          new = r"/^\/functions\/v1\/(admin-panel|seller-panel|subscription-panel|playlist-source-manager|app-release)(?:\/|$)/"
          assert old in s
          s = s.replace(old, new, 1)
          auth.write_text(s)

          test = Path('scripts/check-universal-playlist-source.mjs')
          s = test.read_text()
          s = s.replace("import assert from 'node:assert/strict';\n", "import assert from 'node:assert/strict';\nimport { readFile } from 'node:fs/promises';\n", 1)
          s += r'''

          const managerSource = await readFile(new URL('../supabase/functions/playlist-source-manager/index.ts', import.meta.url), 'utf8');
          const migrationSource = await readFile(new URL('../supabase/migrations/20260805210500_universal_playlist_sources.sql', import.meta.url), 'utf8');
          const guardMigrationSource = await readFile(new URL('../supabase/migrations/20260806012800_universal_playlist_shared_source_guard.sql', import.meta.url), 'utf8');
          const panelSource = await readFile(new URL('../admin-panel/universal-playlist-registration.js', import.meta.url), 'utf8');
          const authSource = await readFile(new URL('../admin-panel/panel-auth-session.js', import.meta.url), 'utf8');

          assert.match(managerSource, /principal\.role === 'seller' && security\.mode !== 'strict'/);
          assert.match(managerSource, /A edição da origem e da segurança é restrita ao administrador/);
          assert.match(managerSource, /Os detalhes sensíveis da origem são restritos ao administrador/);
          assert.match(managerSource, /if \(!created && !editing\)/);
          assert.match(managerSource, /sem alterar configuração, segurança ou endpoints/);
          assert.match(migrationSource, /v_role = 'seller' and p_existing_playlist_id is not null/);
          assert.match(migrationSource, /v_role = 'seller' and v_tls_mode <> 'strict'/);
          assert.match(migrationSource, /p_existing_playlist_id is null and v_created is false/);
          assert.match(guardMigrationSource, /v_role = 'seller' and p_existing_playlist_id is not null/);
          assert.match(guardMigrationSource, /v_role = 'seller' and v_tls_mode <> 'strict'/);
          assert.match(guardMigrationSource, /p_existing_playlist_id is null and v_created is false/);
          assert.match(guardMigrationSource, /universal_playlist_reused/);
          assert.match(panelSource, /data-upl-admin-security/);
          assert.match(panelSource, /state\.surface === 'seller' \? 'strict'/);
          assert.match(panelSource, /state\.surface === 'admin' \? `<button class="upl-btn"/);
          assert.match(authSource, /'playlist-source-manager': true/);
          assert.match(authSource, /subscription-panel\|playlist-source-manager\|app-release/);

          console.log('Cadastro universal: isolamento de fontes compartilhadas, autenticação e TLS administrativo aprovados.');
          '''
          test.write_text(s)
          PY

          node --check admin-panel/universal-playlist-registration.js
          node --check admin-panel/panel-auth-session.js
          node --experimental-strip-types scripts/check-universal-playlist-source.mjs

      - name: Commit hardened implementation
        shell: bash
        run: |
          rm .github/workflows/apply-universal-source-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: isolar fontes compartilhadas e restringir TLS"
          git push origin HEAD:agent/universal-playlist-registration
