name: Apply endpoint hydration fix

on:
  push:
    branches:
      - agent/universal-endpoint-device-failover
    paths:
      - .github/workflows/apply-endpoint-hydration-fix.yml

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/universal-endpoint-device-failover
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Apply patch
        run: python3 scripts/fix-endpoint-progressive-hydration.py
      - name: Compile Android
        working-directory: native-android
        run: gradle --no-daemon :app:assembleDebug
      - name: Commit verified fix
        run: |
          git config user.name roneca-automation
          git config user.email actions@users.noreply.github.com
          git add native-android/app/src/main/java/com/ronecaplaytv/nativeapp/catalog/CatalogViewModel.kt
          git commit -m "fix: manter endpoint ativo na hidratação progressiva"
          git push origin HEAD:agent/universal-endpoint-device-failover
