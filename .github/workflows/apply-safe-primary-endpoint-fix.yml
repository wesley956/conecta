name: Apply safe primary endpoint fix

on:
  push:
    branches:
      - agent/prevent-generic-endpoint-primary
    paths:
      - .github/workflows/apply-safe-primary-endpoint-fix.yml

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prevent-generic-endpoint-primary
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply guarded patch
        shell: python
        run: |
          from pathlib import Path

          shared = Path('supabase/functions/_shared/universalPlaylistSource.ts')
          text = shared.read_text()
          anchor = "function credentialsFromUrl(url: URL) {"
          helper = """export function resolveSafePrimaryIndex(\n  endpoints: ParsedEndpoint[],\n  requestedIndex: number,\n  fallbackIndex = 0,\n) {\n  const fallback = Number.isSafeInteger(fallbackIndex)\n    && fallbackIndex >= 0\n    && fallbackIndex < endpoints.length\n    ? fallbackIndex\n    : 0;\n  const requested = Number.isSafeInteger(requestedIndex)\n    && requestedIndex >= 0\n    && requestedIndex < endpoints.length\n    ? requestedIndex\n    : fallback;\n  const selected = endpoints[requested];\n  const selectedPath = String(selected?.path || '/').replace(/\\/+$/, '') || '/';\n  const genericRoot = selected?.type === 'direct' && selectedPath === '/';\n  if (!genericRoot) return requested;\n\n  const richerIndex = endpoints.findIndex(endpoint => {\n    if (endpoint.active === false) return false;\n    const path = String(endpoint.path || '/').replace(/\\/+$/, '') || '/';\n    return ['xtream', 'm3u', 'hls', 'api', 'stalker'].includes(endpoint.type)\n      && path !== '/';\n  });\n  return richerIndex >= 0 ? richerIndex : requested;\n}\n\n"""
          if helper.strip() not in text:
            if anchor not in text:
              raise SystemExit('shared helper anchor not found')
            text = text.replace(anchor, helper + anchor, 1)
            shared.write_text(text)

          manager = Path('supabase/functions/playlist-source-manager/index.ts')
          text = manager.read_text()
          old_import = "  parseStructuredSource,\n  safeConnectionProfileSummary,"
          new_import = "  parseStructuredSource,\n  resolveSafePrimaryIndex,\n  safeConnectionProfileSummary,"
          if new_import not in text:
            if old_import not in text:
              raise SystemExit('manager import anchor not found')
            text = text.replace(old_import, new_import, 1)

          old_fn = """function setPrimary(parsed: ParsedUniversalSource, value: unknown) {\n  const requested = Number(value ?? parsed.recommendation.primaryIndex);\n  const index = Number.isSafeInteger(requested) && requested >= 0 && requested < parsed.endpoints.length\n    ? requested\n    : parsed.recommendation.primaryIndex;\n  parsed.endpoints.forEach((endpoint, endpointIndex) => {\n    endpoint.primary = endpointIndex === index;\n    endpoint.priority = endpointIndex + 1;\n  });\n  return parsed.endpoints[index];\n}\n"""
          new_fn = """function setPrimary(parsed: ParsedUniversalSource, value: unknown) {\n  const requested = Number(value ?? parsed.recommendation.primaryIndex);\n  const index = resolveSafePrimaryIndex(\n    parsed.endpoints,\n    requested,\n    parsed.recommendation.primaryIndex,\n  );\n  if (index !== requested) {\n    parsed.warnings.push(\n      'Um domínio raiz genérico não pode substituir uma origem completa; o endpoint mais seguro foi mantido como principal.',\n    );\n  }\n  parsed.endpoints.forEach((endpoint, endpointIndex) => {\n    endpoint.primary = endpointIndex === index;\n    endpoint.priority = endpointIndex + 1;\n  });\n  return parsed.endpoints[index];\n}\n"""
          if new_fn not in text:
            if old_fn not in text:
              raise SystemExit('setPrimary anchor not found')
            text = text.replace(old_fn, new_fn, 1)
            manager.write_text(text)

          panel = Path('admin-panel/universal-playlist-registration.js')
          text = panel.read_text()
          old_radio = "<input type=\"radio\" name=\"uplPrimaryEndpoint\" value=\"${index}\" ${endpoint.primary || index === 0 ? 'checked' : ''}>"
          new_radio = "<input type=\"radio\" name=\"uplPrimaryEndpoint\" value=\"${index}\" ${endpoint.primary || index === 0 ? 'checked' : ''} ${endpoint.type === 'direct' && (!endpoint.path || endpoint.path === '/') && (draft.endpoints || []).some(function (candidate) { return ['xtream','m3u','hls','api','stalker'].includes(candidate.type) && candidate.active !== false && candidate.path && candidate.path !== '/'; }) ? 'disabled' : ''}>"
          if new_radio not in text:
            if old_radio not in text:
              raise SystemExit('panel radio anchor not found')
            text = text.replace(old_radio, new_radio, 1)
            panel.write_text(text)

          test = Path('scripts/check-universal-playlist-source.mjs')
          text = test.read_text()
          old_test_import = "  parseStructuredSource,\n  safeEndpointPreview,"
          new_test_import = "  parseStructuredSource,\n  resolveSafePrimaryIndex,\n  safeEndpointPreview,"
          if new_test_import not in text:
            if old_test_import not in text:
              raise SystemExit('test import anchor not found')
            text = text.replace(old_test_import, new_test_import, 1)

          test_anchor = "assert.ok(parsed.endpoints.some(item => item.host === 'spd.blc-atena.com'));\n"
          test_block = """assert.ok(parsed.endpoints.some(item => item.host === 'spd.blc-atena.com'));\n\nconst protectedPrimary = resolveSafePrimaryIndex([\n  { type: 'xtream', path: '/player_api.php', active: true },\n  { type: 'direct', path: '/', active: true },\n], 1, 0);\nassert.equal(protectedPrimary, 0, 'Domínio raiz genérico não substitui Xtream completo');\nconst standaloneDirect = resolveSafePrimaryIndex([\n  { type: 'direct', path: '/', active: true },\n], 0, 0);\nassert.equal(standaloneDirect, 0, 'Origem direta isolada continua permitida');\n"""
          if "Domínio raiz genérico não substitui Xtream completo" not in text:
            if test_anchor not in text:
              raise SystemExit('test anchor not found')
            text = text.replace(test_anchor, test_block, 1)
          static_anchor = "assert.match(managerSource, /principal\\.role === 'seller' && security\\.mode !== 'strict'/);"
          static_line = "assert.match(managerSource, /resolveSafePrimaryIndex/);\n" + static_anchor
          if "assert.match(managerSource, /resolveSafePrimaryIndex/);" not in text:
            if static_anchor not in text:
              raise SystemExit('static test anchor not found')
            text = text.replace(static_anchor, static_line, 1)
          test.write_text(text)

      - name: Validate parser and panel
        run: node scripts/check-universal-playlist-source.mjs

      - name: Check Edge Function
        run: deno check supabase/functions/playlist-source-manager/index.ts

      - name: Check panel JavaScript
        run: node --check admin-panel/universal-playlist-registration.js

      - name: Commit verified fix
        run: |
          git config user.name roneca-automation
          git config user.email actions@users.noreply.github.com
          git add supabase/functions/_shared/universalPlaylistSource.ts \
                  supabase/functions/playlist-source-manager/index.ts \
                  admin-panel/universal-playlist-registration.js \
                  scripts/check-universal-playlist-source.mjs
          git commit -m "fix: prevent generic endpoint as primary"
          git push origin HEAD:agent/prevent-generic-endpoint-primary
