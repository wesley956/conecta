name: Validate Pull Request

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-and-server:
    name: Web, parser and production server
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify parser, TypeScript and standard build
        run: npm run verify

      - name: Validate production server syntax
        run: node --check server.mjs

      - name: Build single-file distribution
        run: npm run build:singlefile

      - name: Publish bundle measurements
        shell: bash
        run: |
          set -euo pipefail
          echo '## Bundle measurements' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '| File | Bytes | MiB |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---:|---:|' >> "$GITHUB_STEP_SUMMARY"

          find dist -type f -print0 | sort -z | while IFS= read -r -d '' file; do
            bytes=$(stat -c '%s' "$file")
            mib=$(awk -v value="$bytes" 'BEGIN { printf "%.2f", value / 1024 / 1024 }')
            echo "| \`$file\` | $bytes | $mib |" >> "$GITHUB_STEP_SUMMARY"
          done

          total=$(find dist -type f -printf '%s\n' | awk '{sum += $1} END {print sum + 0}')
          total_mib=$(awk -v value="$total" 'BEGIN { printf "%.2f", value / 1024 / 1024 }')
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "**Total: $total bytes ($total_mib MiB)**" >> "$GITHUB_STEP_SUMMARY"

  edge-functions:
    name: Supabase Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Functions individually
        id: edge-check
        shell: bash
        run: |
          set -uo pipefail
          mapfile -t functions < <(find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts -print | sort)
          : > deno-check.log

          if [ "${#functions[@]}" -eq 0 ]; then
            echo 'Nenhuma Edge Function encontrada.' | tee -a deno-check.log
            exit 1
          fi

          failed=0
          echo '## Supabase Edge Functions' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '| Function | Result |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"

          for function_file in "${functions[@]}"; do
            function_name=$(basename "$(dirname "$function_file")")
            echo "===== $function_name ($function_file) =====" | tee -a deno-check.log

            set +e
            deno check "$function_file" 2>&1 | tee -a deno-check.log
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              echo "| \`$function_name\` | ✅ |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$function_name\` | ❌ |" >> "$GITHUB_STEP_SUMMARY"
              echo "::error file=$function_file::deno check falhou para $function_name"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'O relatório completo está no artefato `deno-check-report`.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload Deno check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deno-check-report
          path: deno-check.log
          if-no-files-found: error
          retention-days: 14

  database:
    name: Supabase migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start isolated Supabase database
        run: >-
          npx supabase start
          -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Reapply all migrations from zero
        run: npx supabase db reset --local --no-seed

      - name: Lint PostgreSQL functions and schema
        run: npx supabase db lint --local --schema public --level error --fail-on error

      - name: Run pgTAP database tests
        shell: bash
        run: |
          set -euo pipefail
          if ! compgen -G 'supabase/tests/*' > /dev/null; then
            echo 'Nenhum teste de banco foi encontrado em supabase/tests.'
            exit 1
          fi
          npx supabase test db --local

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
