name: Validate Pull Request

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  panel-and-tooling:
    name: Admin panels, parser and native-only rules
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate parsers and panels
        run: |
          npm run check:m3u-parser
          npm run check:panel-auth
          npm run check:seller-provisioning
          npm run check:playlist-failover
          npm run check:inline-playlist-activation
          npm run check:finance-module

      - name: Validate native-only architecture
        run: node scripts/check-native-only.mjs

      - name: Validate production server syntax
        run: node --check server.mjs

  native-android:
    name: Native Android Compose and Media3
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Compile native debug APK
        working-directory: native-android
        run: gradle --no-daemon :app:assembleDebug

  edge-functions:
    name: Supabase Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Functions individually
        id: edge-check
        shell: bash
        run: |
          set -uo pipefail
          mapfile -t functions < <(find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts -print | sort)
          : > deno-check.log

          if [ "${#functions[@]}" -eq 0 ]; then
            echo 'Nenhuma Edge Function encontrada.' | tee -a deno-check.log
            exit 1
          fi

          failed=0
          echo '## Supabase Edge Functions' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '| Function | Result |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"

          for function_file in "${functions[@]}"; do
            function_name=$(basename "$(dirname "$function_file")")
            echo "===== $function_name ($function_file) =====" | tee -a deno-check.log

            set +e
            deno check "$function_file" 2>&1 | tee -a deno-check.log
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              echo "| \`$function_name\` | ✅ |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$function_name\` | ❌ |" >> "$GITHUB_STEP_SUMMARY"
              echo "::error file=$function_file::deno check falhou para $function_name"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'O relatório completo está no artefato `deno-check-report`.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload Deno check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deno-check-report
          path: deno-check.log
          if-no-files-found: error
          retention-days: 14

  database:
    name: Supabase migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      OPENAI_API_KEY: unused-in-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Start isolated PostgreSQL
        shell: bash
        run: |
          set -uo pipefail
          set +e
          npx supabase db start > supabase-db-start.log 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo '::error::Falha ao iniciar o PostgreSQL local do Supabase.'
            tail -n 20 supabase-db-start.log
            exit "$status"
          fi

          tail -n 8 supabase-db-start.log

      - name: Upload PostgreSQL startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-db-start-diagnostics
          path: supabase-db-start.log
          if-no-files-found: error
          retention-days: 7

      - name: Reapply all migrations from zero
        run: npx supabase db reset --local --no-seed

      - name: Lint PostgreSQL functions and schema
        run: npx supabase db lint --local --schema public --level error --fail-on error

      - name: Run pgTAP database tests
        shell: bash
        run: |
          set -euo pipefail
          if ! compgen -G 'supabase/tests/*' > /dev/null; then
            echo 'Nenhum teste de banco foi encontrado em supabase/tests.'
            exit 1
          fi
          npx supabase test db --local

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
