name: Apply Playlist Update Guard

on:
  push:
    branches:
      - agent/fix-store-playlist-update-not-found

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-store-playlist-update-not-found
          fetch-depth: 0

      - name: Apply playlist update guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/stores/appStore.ts')
          source = path.read_text(encoding='utf-8')
          start_marker = '  updatePlaylist: (playlistId, partial) =>'
          end_marker = '\n\n  replaceM3UPlaylist:'

          start = source.find(start_marker)
          if start < 0:
              raise SystemExit('Início de updatePlaylist não encontrado.')

          end = source.find(end_marker, start)
          if end < 0:
              raise SystemExit('Fim de updatePlaylist não encontrado.')

          new_block = """  updatePlaylist: (playlistId, partial) => set((state) => {
    const exists = state.playlists.some((playlist) => playlist.id === playlistId);

    if (!exists) {
      return {
        activeNotice: `Atenção: lista ${playlistId} não encontrada.`,
      };
    }

    return {
      playlists: state.playlists.map((playlist) =>
        playlist.id === playlistId
          ? { ...playlist, ...partial, lastSync: partial.lastSync ?? playlist.lastSync }
          : playlist
      ),
      activeNotice: '✅ Lista atualizada.',
    };
  }),"""

          next_source = source[:start] + new_block + source[end:]
          path.write_text(next_source, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run typecheck

      - name: Commit generated patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/stores/appStore.ts
          git commit -m 'fix: report missing playlist updates'
          git push origin HEAD:agent/fix-store-playlist-update-not-found
